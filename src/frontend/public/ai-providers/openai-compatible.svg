<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none">
  <title>OpenAI Compatible API</title>
  <defs>
    <linearGradient id="api-surface" x1="4" y1="3" x2="20" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="api-border" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect x=".45" y=".45" width="23.1" height="23.1" rx="6.4" fill="url(#api-surface)" fill-opacity=".3" stroke="url(#api-border)" stroke-width="1.35"/>
  <text x="12" y="15.4" fill="#5145CD" font-family="Arial, Helvetica, sans-serif" font-size="8.1" font-weight="700" letter-spacing=".15" text-anchor="middle">API</text>
</svg>
