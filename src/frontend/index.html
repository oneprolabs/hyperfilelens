<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/brand/icons/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="dns-prefetch" href="https://challenges.cloudflare.com" />
    <title>HyperFileLens</title>
    <style>
      :root {
        --boot-bg: #f4f4f7;
        --boot-ink: #171721;
        --boot-primary: #6d5ef6;
        --boot-accent: #f5a623;
      }

      html,
      body,
      #app {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--boot-bg);
        font-family: "Inter", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .hfl-boot {
        min-height: 100vh;
        display: grid;
        align-items: center;
        justify-items: center;
        padding: 32px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 42%, rgba(109, 94, 246, 0.1), transparent 28%),
          var(--boot-bg);
      }

      .hfl-boot__panel {
        display: grid;
        justify-items: center;
        gap: 16px;
        width: min(280px, 100%);
        color: var(--boot-ink);
        text-align: center;
      }

      .hfl-boot__lockup {
        display: block;
        width: min(260px, 100%);
        height: 48px;
        object-fit: cover;
        object-position: center 40%;
      }

      .hfl-boot__bar {
        position: relative;
        width: min(243px, 100%);
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(109, 94, 246, 0.18);
      }

      .hfl-boot__bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--boot-accent), var(--boot-primary));
        box-shadow: 0 0 10px rgba(109, 94, 246, 0.24);
        animation: hfl-boot-progress 1.3s ease-in-out infinite;
      }

      @keyframes hfl-boot-progress {
        0% {
          transform: translateX(-115%);
        }

        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hfl-boot" aria-hidden="true">
        <div class="hfl-boot__panel">
          <img
            class="hfl-boot__lockup"
            src="/brand/images/hyperfilelens-lockup-on-light.png"
            alt="HyperFileLens"
          />
          <div class="hfl-boot__bar"></div>
        </div>
      </div>
    </div>
    <script src="/app-runtime-config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
