# Image-only production stack template. Release packaging copies this file to the package root.
# Stable stateful/singleton services run without a profile. The installer starts exactly one
# blue/green API + Web pool through the matching Compose profile and switches stable Nginx.

name: hyperfilelens

x-backend-image: &backend-image
  image: ${HFL_BACKEND_IMAGE:-hyperfilelens-backend:${APP_VERSION:-latest}}
  pull_policy: never
  platform: linux/amd64
  restart: unless-stopped
  env_file:
    - ${HFL_ENV_FILE:-./.env}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    TZ: UTC
  networks:
    - default
    - bridge

x-backend-volumes: &backend-volumes
  # Language packs follow the product Release, not the edition-specific image tag.
  - ./data/lang-packs/versions/${HFL_PRODUCT_VERSION:-latest}:/opt/backend/lang-packs:ro
  - ./data/media:/opt/backend/media
  - ./data/staticfiles:/opt/backend/staticfiles
  - ./data/logs:/var/log/hyperfilelens

x-api: &api
  <<: *backend-image
  environment:
    TZ: UTC
    LOG_FILE: /var/log/hyperfilelens/api.log
    API_WORKERS: "1"
    SENTRY_COMPONENT: hfl-backend
    SENTRY_SERVICE: api
    SENTRY_RELEASE: hyperfilelens-backend@${APP_VERSION:-unknown}
  volumes: *backend-volumes
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  command: api
  stop_grace_period: 90s
  mem_limit: 512m
  cpus: 0.50
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "curl -fsS http://127.0.0.1:8000/health/ready >/dev/null && python -c \"import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',8001)); s.close()\"",
      ]
    interval: 5s
    timeout: 3s
    retries: 30
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "10"

x-web: &web
  image: ${HFL_FRONTEND_IMAGE:-hyperfilelens-frontend:${APP_VERSION:-latest}}
  pull_policy: never
  platform: linux/amd64
  restart: unless-stopped
  environment:
    TZ: UTC
    HFL_WEBSITE_APP_URL: ${FRONTEND_URL:-}
    HFL_GA_MEASUREMENT_ID: ${HFL_GA_MEASUREMENT_ID:-}
    HFL_SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
    HFL_SENTRY_DSN: ${SENTRY_FRONTEND_DSN:-}
    HFL_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    HFL_SENTRY_RELEASE: hyperfilelens-frontend@${APP_VERSION:-unknown}
    HFL_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    LOGROTATE_INTERVAL_SECONDS: "3600"
  volumes:
    - ./deploy/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    - ./data/lang-packs/versions/${HFL_PRODUCT_VERSION:-latest}:/opt/hyperfilelens/lang-packs:ro
  networks:
    - default
  mem_limit: 128m
  cpus: 0.125
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "nginx -t >/dev/null 2>&1 && wget -qO- http://127.0.0.1:8080/health >/dev/null && wget -qO- http://127.0.0.1:8081/health >/dev/null && wget -qO- http://127.0.0.1:8082/health >/dev/null",
      ]
    interval: 5s
    timeout: 3s
    retries: 30
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "10"

services:
  worker:
    <<: *backend-image
    environment:
      TZ: UTC
      LOG_FILE: /var/log/hyperfilelens/worker.log
      SENTRY_COMPONENT: hfl-backend
      SENTRY_SERVICE: worker
      SENTRY_RELEASE: hyperfilelens-backend@${APP_VERSION:-unknown}
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: worker
    stop_grace_period: 600s
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' </proc/1/cmdline | grep -Eq 'celery .*worker' && python -c \"import os,socket; pg_host=os.getenv('POSTGRES_HOST','postgres'); pg_port=int(os.getenv('POSTGRES_PORT','5432')); s=socket.socket(); s.settimeout(1); s.connect((pg_host,pg_port)); s.close(); s=socket.socket(); s.settimeout(1); s.connect(('redis',6379)); s.close()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

  scheduler:
    <<: *backend-image
    environment:
      TZ: UTC
      LOG_FILE: /var/log/hyperfilelens/scheduler.log
      SENTRY_COMPONENT: hfl-backend
      SENTRY_SERVICE: scheduler
      SENTRY_RELEASE: hyperfilelens-backend@${APP_VERSION:-unknown}
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: scheduler
    stop_grace_period: 60s
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(pgrep -f '[c]elery.* beat' >/dev/null || test -f /tmp/hfl-scheduler-standby) && python -c \"import os,socket; pg_host=os.getenv('POSTGRES_HOST','postgres'); pg_port=int(os.getenv('POSTGRES_PORT','5432')); s=socket.socket(); s.settimeout(1); s.connect((pg_host,pg_port)); s.close(); s=socket.socket(); s.settimeout(1); s.connect(('redis',6379)); s.close(); print('ok')\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

  migration:
    <<: *backend-image
    profiles: ["tools"]
    restart: "no"
    environment:
      TZ: UTC
      LOG_FILE: /var/log/hyperfilelens/api.log
      SENTRY_COMPONENT: hfl-backend
      SENTRY_SERVICE: migration
      SENTRY_RELEASE: hyperfilelens-backend@${APP_VERSION:-unknown}
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: migrate

  api-blue:
    <<: *api
    profiles: ["blue"]

  api-green:
    <<: *api
    profiles: ["green"]

  web-blue:
    <<: *web
    profiles: ["blue"]

  web-green:
    <<: *web
    profiles: ["green"]

  postgres:
    image: hyperfilelens-postgres:17
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ${HFL_ENV_FILE:-./.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hyperfilelens}
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hyperfilelens} -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    mem_limit: 512m
    cpus: 0.50

  redis:
    image: hyperfilelens-redis:alpine
    pull_policy: never
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    mem_limit: ${HFL_REDIS_MEMORY_LIMIT:-2g}
    cpus: 1.00

  nginx:
    # The stable entry has an independently pinned lifecycle. Application
    # upgrades reload its configuration but cannot recreate it unexpectedly.
    image: hyperfilelens-frontend:${HFL_GATEWAY_VERSION:-latest}
    pull_policy: never
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: UTC
      HFL_WEBSITE_APP_URL: ${FRONTEND_URL:-}
      HFL_GA_MEASUREMENT_ID: ${HFL_GA_MEASUREMENT_ID:-}
      HFL_SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      HFL_SENTRY_DSN: ${SENTRY_FRONTEND_DSN:-}
      HFL_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      HFL_SENTRY_RELEASE: hyperfilelens-frontend@${APP_VERSION:-unknown}
      HFL_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      LOGROTATE_INTERVAL_SECONDS: "3600"
      LOGROTATE_STATE: /var/log/hyperfilelens/.logrotate.status
      LOGROTATE_LOCK: /var/log/hyperfilelens/.logrotate.lock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${HFL_WEBSITE_BIND_ADDRESS:-0.0.0.0}:${HFL_WEBSITE_PORT:-11442}:11442"
      - "${HFL_TENANT_BIND_ADDRESS:-0.0.0.0}:${HFL_TENANT_PORT:-11443}:11443"
      - "${HFL_ADMIN_BIND_ADDRESS:-0.0.0.0}:${HFL_ADMIN_PORT:-11444}:11444"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/snippets:/etc/nginx/snippets:ro
      - ./data/media:/opt/backend/media:ro
      - ./data/staticfiles:/opt/django-static:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./data/logs:/var/log/hyperfilelens
      - ./deploy/logrotate/hyperfilelens.conf:/etc/logrotate.d/hyperfilelens:ro
    networks:
      - default
      - bridge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nginx -t >/dev/null 2>&1 && wget --no-check-certificate -qO- https://127.0.0.1:11443/health/ready >/dev/null && sh /etc/nginx/snippets/check-language-packs.sh && wget --no-check-certificate -qO- https://127.0.0.1:11442/health >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    mem_limit: 128m
    cpus: 0.125

networks:
  bridge:
    external: true
    name: hyperfilelens-bridge
