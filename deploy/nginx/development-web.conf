# Development-only Web router. It exposes the same stable service contract as
# the Release Web image while keeping Vite's implementation port private.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
    }

    server {
        listen 8081;
        server_name _;

        location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
    }

    server {
        listen 8082;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/website;
        index index.html;

        location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = /website-runtime-config.js {
            try_files /website-runtime-config.js =404;
            add_header Cache-Control "no-store";
        }
        location = / { return 302 /en/; }
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / { try_files $uri $uri/ =404; }
    }
}
