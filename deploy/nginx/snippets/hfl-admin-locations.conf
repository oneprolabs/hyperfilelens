# Ops / break-glass routes (server context) — Django Admin + collectstatic assets.
# Include only on listeners that expose /admin/ (standalone :11443/:11444,
# SaaS :11444).

    location /static/ {
        alias /opt/hyperfilelens/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /admin/ {
        proxy_pass http://hfl_api_http;
        include /etc/nginx/snippets/hfl-backend-proxy-headers.inc;
    }
