# Protected Agent release downloads (server context).

    location /media/agent-releases/ {
        set $agent_release_original $request_uri;
        alias /opt/hyperfilelens/backend/media/agent-releases/;
        autoindex off;
        auth_request /_internal/agent-releases/auth;
        auth_request_set $agent_release_denial $upstream_http_x_hfl_download_denial;
        auth_request_set $agent_release_retry_after $upstream_http_retry_after;
        error_page 401 = @agent_releases_unauthorized;
        error_page 403 = @agent_releases_denied;
    }

    location = /_internal/agent-releases/auth {
        internal;
        proxy_pass http://hfl_api_http/api/v1/node/enrollment/agent-releases/auth$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-HFL-Site-Role $hfl_site;
        proxy_set_header X-Original-URI $agent_release_original;
    }

    location @agent_releases_unauthorized {
        return 401;
    }

    location @agent_releases_denied {
        # Other 403 responses remain authorization failures. Only the
        # explicitly marked auth subrequest denotes temporary capacity.
        add_header Retry-After $agent_release_retry_after always;
        add_header X-HFL-Download-Denial $agent_release_denial always;
        if ($agent_release_denial = authorization-capacity) {
            return 429;
        }
        return 403;
    }
