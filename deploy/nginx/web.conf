# Internal, unencrypted static Web pool. It is reachable only from stable Nginx on
# the Compose network and never publishes a host port.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health { access_log off; return 200 "ok\n"; }
    location = /app-runtime-config.js {
        alias /usr/share/nginx/runtime/tenant-app-runtime-config.js;
        add_header Cache-Control "no-store";
    }
    location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location ^~ /locales/ {
        alias /opt/hyperfilelens/lang-packs/;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /index.html { try_files $uri =404; add_header Cache-Control "no-cache, must-revalidate"; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;

    location = /health { access_log off; return 200 "ok\n"; }
    location = /app-runtime-config.js {
        alias /usr/share/nginx/runtime/admin-app-runtime-config.js;
        add_header Cache-Control "no-store";
    }
    location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location ^~ /locales/ {
        alias /opt/hyperfilelens/lang-packs/;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /index.html { try_files $uri =404; add_header Cache-Control "no-cache, must-revalidate"; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 8082;
    server_name _;
    # Keep redirects relative so the public gateway (:11442) is not rewritten to
    # this internal listen port (which is never published on the host).
    absolute_redirect off;
    root /usr/share/nginx/website;
    index index.html;

    location = /health { access_log off; return 200 "ok\n"; }
    location = /website-runtime-config.js {
        try_files /website-runtime-config.js =404;
        add_header Cache-Control "no-store";
    }
    location = / { return 302 /en/; }
    location / { try_files $uri $uri/ $uri.html =404; }
}
