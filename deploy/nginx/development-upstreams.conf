# Development override: production uses installer-managed blue/green service names.
# ``resolve`` keeps upstream addresses current when Compose recreates API or Web.
upstream hfl_api_http { zone hfl_api_http 64k; server api:8000 resolve; keepalive 32; }
upstream hfl_api_ws { zone hfl_api_ws 64k; server api:8001 resolve; }
upstream hfl_web_tenant { zone hfl_web_tenant 64k; server web:8080 resolve; }
upstream hfl_web_ops { zone hfl_web_ops 64k; server web:8081 resolve; }
upstream hfl_website { zone hfl_website 64k; server web:8082 resolve; }
