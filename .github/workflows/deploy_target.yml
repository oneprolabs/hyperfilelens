name: HFL - Target Deploy (Reusable)

on:
  workflow_call:
    inputs:
      target:
        description: Deployment target identity (test, community, or prod)
        required: true
        type: string
      channel:
        description: Artifact channel (release)
        required: false
        default: release
        type: string
      package_source:
        description: Package source (github or host-store)
        required: false
        default: github
        type: string
      allow_automatic_prod:
        description: Allow a trusted caller to deploy PROD outside workflow_dispatch
        required: false
        default: false
        type: boolean
      tag:
        description: Published HFL artifact identifier to deploy
        required: true
        type: string
      public_url:
        description: Optional canonical HFL browser URL
        required: false
        default: ''
        type: string
      admin_public_url:
        description: Optional canonical Admin Console browser URL
        required: false
        default: ''
        type: string
      release_download_proxy_url:
        description: Optional target-side HTTP(S) proxy; empty or UNCONFIGURED means direct download
        required: false
        default: ''
        type: string
      ssh_host:
        description: SSH deployment hostname or IP address
        required: true
        type: string
      ssh_port:
        description: SSH deployment port
        required: true
        type: string
      ssh_user:
        description: SSH deployment user
        required: true
        type: string
      ssh_known_hosts:
        description: Verified SSH known_hosts entries
        required: true
        type: string
      turnstile_site_key:
        description: Public Cloudflare Turnstile site key
        required: false
        default: ''
        type: string
      turnstile_enabled:
        description: Require Turnstile on the SaaS deployment target
        required: true
        type: boolean
      email_signup_enabled:
        description: Allow anonymous email/password registration
        required: false
        default: false
        type: boolean
      email_code_login_enabled:
        description: Allow tenant email verification-code sign-in
        required: false
        default: true
        type: boolean
      google_oauth_enabled:
        description: Allow Google OAuth sign-in when credentials are valid
        required: false
        default: false
        type: boolean
      google_client_id:
        description: Optional Google OAuth web client ID
        required: false
        default: ''
        type: string
      ga_measurement_id:
        description: Optional GA4 measurement ID for the official SaaS deployment
        required: false
        default: ''
        type: string
      sentry_enabled:
        description: Enable HFL-managed Sentry reporting for this deployment target
        required: false
        default: false
        type: boolean
      platform_gateway_auto_deploy:
        description: Automatically deploy an HFL-managed local platform Gateway
        required: false
        default: false
        type: boolean
      hfl_insecure_tls:
        description: Environment-wide TLS policy for remotely enrolled HFL Agents (0 verifies, 1 skips)
        required: true
        type: string
      smtp_host:
        description: Optional SMTP server hostname; configure all SMTP inputs together
        required: false
        default: ''
        type: string
      smtp_port:
        description: Optional SMTP server port
        required: false
        default: ''
        type: string
      smtp_username:
        description: Optional SMTP account username
        required: false
        default: ''
        type: string
      smtp_security:
        description: Optional SMTP transport security (ssl, starttls, or none)
        required: false
        default: ''
        type: string
      email_from:
        description: Optional sender identity for outbound email
        required: false
        default: ''
        type: string
      ai_model_provider:
        description: Optional deployment-managed SourceLens model provider
        required: false
        default: ''
        type: string
      ai_model_id:
        description: Optional deployment-managed SourceLens model identifier
        required: false
        default: ''
        type: string
      ai_model_display_name:
        description: Optional deployment-managed model display name
        required: false
        default: ''
        type: string
      ai_multimodal_model_provider:
        description: Optional deployment-managed multimodal model provider
        required: false
        default: ''
        type: string
      ai_multimodal_model_id:
        description: Optional deployment-managed multimodal model identifier
        required: false
        default: ''
        type: string
      ai_multimodal_model_display_name:
        description: Optional deployment-managed multimodal model display name
        required: false
        default: ''
        type: string
    secrets:
      ssh_private_key:
        description: SSH private key for the deployment target
        required: true
      turnstile_secret_key:
        description: Private Cloudflare Turnstile verification key
        required: false
      smtp_password:
        description: Optional SMTP account password
        required: false
      google_client_secret:
        description: Optional Google OAuth web client secret
        required: false
      ai_model_api_base:
        description: Optional HTTPS API base for the deployment-managed model
        required: false
      ai_model_api_key:
        description: Optional API key for the deployment-managed model
        required: false
      sentry_backend_dsn:
        description: Optional HFL backend Sentry DSN
        required: false
      sentry_frontend_dsn:
        description: Optional HFL browser Sentry DSN
        required: false
      sentry_auth_token:
        description: Optional Sentry API token used only for deployment markers
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.target == 'test' && 'Deploy · TEST' || inputs.target == 'community' && 'Deploy · Community' || 'Deploy · PROD' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: hyperfilelens-deploy-${{ inputs.target }}
      cancel-in-progress: false
    env:
      APP_PUBLIC_URL: ${{ inputs.public_url }}
      ADMIN_PUBLIC_URL: ${{ inputs.admin_public_url }}
      DEPLOY_SSH_HOST: ${{ inputs.ssh_host }}
      DEPLOY_SSH_PORT: ${{ inputs.ssh_port }}
      DEPLOY_SSH_USER: ${{ inputs.ssh_user }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ inputs.ssh_known_hosts }}
      RELEASE_DOWNLOAD_PROXY_URL: ${{ inputs.release_download_proxy_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Deployment Inputs
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
          SMTP_HOST: ${{ inputs.smtp_host }}
          SMTP_PORT: ${{ inputs.smtp_port }}
          SMTP_USERNAME: ${{ inputs.smtp_username }}
          SMTP_PASSWORD: ${{ secrets.smtp_password }}
          SMTP_SECURITY: ${{ inputs.smtp_security }}
          EMAIL_FROM: ${{ inputs.email_from }}
          EMAIL_SIGNUP_ENABLED: ${{ inputs.email_signup_enabled }}
          EMAIL_CODE_LOGIN_ENABLED: ${{ inputs.email_code_login_enabled }}
          GOOGLE_OAUTH_ENABLED: ${{ inputs.google_oauth_enabled }}
          GOOGLE_CLIENT_ID: ${{ inputs.google_client_id }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.google_client_secret }}
          GA_MEASUREMENT_ID: ${{ inputs.ga_measurement_id }}
          SENTRY_ENABLED: ${{ inputs.sentry_enabled }}
          SENTRY_BACKEND_DSN: ${{ secrets.sentry_backend_dsn }}
          SENTRY_FRONTEND_DSN: ${{ secrets.sentry_frontend_dsn }}
          TURNSTILE_ENABLED: ${{ inputs.turnstile_enabled }}
          TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}
          TURNSTILE_SECRET_KEY: ${{ secrets.turnstile_secret_key }}
          AI_MODEL_PROVIDER: ${{ inputs.ai_model_provider }}
          AI_MODEL_ID: ${{ inputs.ai_model_id }}
          AI_MODEL_DISPLAY_NAME: ${{ inputs.ai_model_display_name }}
          AI_MULTIMODAL_MODEL_PROVIDER: ${{ inputs.ai_multimodal_model_provider }}
          AI_MULTIMODAL_MODEL_ID: ${{ inputs.ai_multimodal_model_id }}
          AI_MULTIMODAL_MODEL_DISPLAY_NAME: ${{ inputs.ai_multimodal_model_display_name }}
          AI_MODEL_API_BASE: ${{ secrets.ai_model_api_base }}
          AI_MODEL_API_KEY: ${{ secrets.ai_model_api_key }}
          ARTIFACT_CHANNEL: ${{ inputs.channel }}
          ARTIFACT_ID: ${{ inputs.tag }}
          DEPLOY_TARGET: ${{ inputs.target }}
          HFL_INSECURE_TLS: ${{ inputs.hfl_insecure_tls }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$DEPLOY_SSH_KNOWN_HOSTS" ]]
          [[ -n "$DEPLOY_SSH_PRIVATE_KEY" ]]
          [[ "$DEPLOY_TARGET" =~ ^(test|community|prod)$ ]]
          [[ "${{ inputs.package_source }}" =~ ^(github|host-store)$ ]]
          [[ "$ARTIFACT_CHANNEL" == "release" ]]
          case "$DEPLOY_TARGET:${{ inputs.package_source }}" in
            community:github|test:host-store|prod:host-store) ;;
            *)
              echo "Deployment target $DEPLOY_TARGET refuses package source ${{ inputs.package_source }}" >&2
              exit 1
              ;;
          esac
          if [[ -n "$RELEASE_DOWNLOAD_PROXY_URL" && "$RELEASE_DOWNLOAD_PROXY_URL" != "UNCONFIGURED" ]]; then
            [[ "$RELEASE_DOWNLOAD_PROXY_URL" =~ ^https?://[A-Za-z0-9.-]+:[0-9]{1,5}$ ]] || {
              echo 'Release download proxy must use http://host:port or https://host:port without credentials' >&2
              exit 2
            }
            proxy_address="${RELEASE_DOWNLOAD_PROXY_URL#*://}"
            proxy_port="${proxy_address##*:}"
            ((proxy_port >= 1 && proxy_port <= 65535))
          fi
          [[ "$ARTIFACT_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "$DEPLOY_TARGET:$ARTIFACT_CHANNEL" in
            test:release|community:release|prod:release) ;;
            *)
              echo "Deployment target $DEPLOY_TARGET refuses channel $ARTIFACT_CHANNEL" >&2
              exit 1
              ;;
          esac
          if [[ "$DEPLOY_TARGET" == "prod" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" \
            && "${{ inputs.allow_automatic_prod }}" != "true" ]]; then
            echo 'Production deployment requires a manual workflow_dispatch event' >&2
            exit 1
          fi
          [[ "$HFL_INSECURE_TLS" =~ ^[01]$ ]] || {
            echo 'HFL_INSECURE_TLS must be 0 or 1' >&2
            exit 1
          }
          case "$DEPLOY_TARGET:$HFL_INSECURE_TLS" in
            test:1|community:1|prod:0) ;;
            *)
              echo "Deployment target $DEPLOY_TARGET refuses HFL_INSECURE_TLS=$HFL_INSECURE_TLS" >&2
              exit 1
              ;;
          esac

          smtp_values=(
            "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USERNAME"
            "$SMTP_PASSWORD" "$SMTP_SECURITY" "$EMAIL_FROM"
          )
          smtp_configured=0
          for value in "${smtp_values[@]}"; do
            [[ -z "$value" ]] || smtp_configured=$((smtp_configured + 1))
          done
          if (( smtp_configured == 0 )); then
            echo '::warning title=SMTP configuration::No SMTP settings were staged; deployment will preserve installed email settings, and password-reset delivery was not verified.'
          elif (( smtp_configured != ${#smtp_values[@]} )); then
            echo '::warning title=SMTP configuration::SMTP settings are partial; deployment will preserve the installed email configuration.'
          fi
          if (( smtp_configured == ${#smtp_values[@]} )); then
            if [[ "$SMTP_HOST" == *[[:space:]]* ]] \
              || [[ ! "$SMTP_PORT" =~ ^[0-9]+$ ]] \
              || (( SMTP_PORT < 1 || SMTP_PORT > 65535 )) \
              || [[ ! "$SMTP_SECURITY" =~ ^(ssl|starttls|none)$ ]] \
              || [[ "$SMTP_PASSWORD" == *$'\n'* || "$SMTP_PASSWORD" == *$'\r'* ]]; then
              echo '::warning title=SMTP configuration::SMTP settings are malformed; deployment will preserve the installed email configuration.'
            fi
          fi
          if [[ "$EMAIL_SIGNUP_ENABLED" == "true" && "$smtp_configured" -ne "${#smtp_values[@]}" ]]; then
            echo '::warning title=Email sign-up::Email sign-up is enabled without a complete staged SMTP configuration; deployment will continue.'
          fi
          if [[ "$EMAIL_CODE_LOGIN_ENABLED" == "true" && "$smtp_configured" -ne "${#smtp_values[@]}" ]]; then
            echo '::warning title=Email-code sign-in::Email-code sign-in is enabled without a complete staged SMTP configuration; deployment will continue.'
          fi

          if [[ "$GOOGLE_OAUTH_ENABLED" == "true" ]]; then
            if [[ ! "$GOOGLE_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]] \
              || [[ -z "$GOOGLE_CLIENT_SECRET" ]] \
              || [[ "$GOOGLE_CLIENT_SECRET" == *$'\n'* || "$GOOGLE_CLIENT_SECRET" == *$'\r'* ]]; then
              echo '::warning title=Google OAuth configuration::Google OAuth settings are missing or malformed; deployment will preserve the installed Google configuration.'
            fi
          fi
          if [[ "$DEPLOY_TARGET" != "prod" && -n "$GA_MEASUREMENT_ID" ]]; then
            echo '::warning title=Google Analytics configuration::Analytics is only supported for the production SaaS target; the supplied value will be ignored.'
          fi
          if [[ "$SENTRY_ENABLED" == "true" ]] \
            && { [[ -z "$SENTRY_BACKEND_DSN" ]] || [[ -z "$SENTRY_FRONTEND_DSN" ]]; }; then
            echo '::warning title=Sentry configuration::Sentry is enabled without both HFL DSNs; the invalid surface will be disabled and deployment will continue.'
          fi
          if [[ "$TURNSTILE_ENABLED" == "true" ]] \
            && { [[ -z "$TURNSTILE_SITE_KEY" ]] || [[ -z "$TURNSTILE_SECRET_KEY" ]]; }; then
            echo '::warning title=Turnstile configuration::Turnstile is enabled without complete credentials; deployment will continue.'
          fi

          ai_model_values=(
            "$AI_MODEL_PROVIDER" "$AI_MODEL_ID" "$AI_MODEL_DISPLAY_NAME"
          )
          ai_model_configured=0
          for value in "${ai_model_values[@]}"; do
            [[ -z "$value" ]] || ai_model_configured=$((ai_model_configured + 1))
          done
          if (( ai_model_configured != 0 && ai_model_configured != ${#ai_model_values[@]} )); then
            echo 'AI model deployment configuration is partial; configure all AI model variables and secrets, or leave all of them empty' >&2
            exit 1
          fi
          if (( ai_model_configured > 0 )); then
            [[ -n "$AI_MODEL_API_BASE" && -n "$AI_MODEL_API_KEY" ]]
            [[ "$AI_MODEL_PROVIDER" =~ ^[a-z0-9_]+$ ]]
            [[ "$AI_MODEL_ID" != *$'\n'* && "$AI_MODEL_ID" != *$'\r'* ]]
            [[ "$AI_MODEL_DISPLAY_NAME" != *$'\n'* && "$AI_MODEL_DISPLAY_NAME" != *$'\r'* ]]
            [[ "$AI_MODEL_API_BASE" == https://* ]]
            [[ "$AI_MODEL_API_BASE" != *$'\n'* && "$AI_MODEL_API_BASE" != *$'\r'* ]]
            [[ "$AI_MODEL_API_KEY" != *$'\n'* && "$AI_MODEL_API_KEY" != *$'\r'* ]]
          fi

          multimodal_values=(
            "$AI_MULTIMODAL_MODEL_PROVIDER"
            "$AI_MULTIMODAL_MODEL_ID"
            "$AI_MULTIMODAL_MODEL_DISPLAY_NAME"
          )
          multimodal_configured=0
          multimodal_valid=1
          for value in "${multimodal_values[@]}"; do
            [[ -z "$value" ]] || multimodal_configured=$((multimodal_configured + 1))
          done
          if (( multimodal_configured != 0 && multimodal_configured != ${#multimodal_values[@]} )); then
            echo '::warning title=Multimodal model configuration::Configuration is partial; the installed multimodal default will be preserved.'
            multimodal_valid=0
          fi
          if (( multimodal_configured > 0 && multimodal_valid == 1 )); then
            if [[ -z "$AI_MODEL_API_BASE" || -z "$AI_MODEL_API_KEY" ]] \
              || [[ ! "$AI_MULTIMODAL_MODEL_PROVIDER" =~ ^[a-z0-9_]+$ ]] \
              || [[ "$AI_MULTIMODAL_MODEL_ID" == *$'\n'* || "$AI_MULTIMODAL_MODEL_ID" == *$'\r'* ]] \
              || [[ "$AI_MULTIMODAL_MODEL_DISPLAY_NAME" == *$'\n'* || "$AI_MULTIMODAL_MODEL_DISPLAY_NAME" == *$'\r'* ]] \
              || [[ "$AI_MODEL_API_BASE" != https://* ]] \
              || [[ "$AI_MODEL_API_BASE" == *$'\n'* || "$AI_MODEL_API_BASE" == *$'\r'* ]] \
              || [[ "$AI_MODEL_API_KEY" == *$'\n'* || "$AI_MODEL_API_KEY" == *$'\r'* ]]; then
              echo '::warning title=Multimodal model configuration::Configuration is malformed; the installed multimodal default will be preserved.'
              multimodal_valid=0
            fi
          fi

      - name: Install SSH Credentials
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.ssh_private_key }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/hyperfilelens_deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/hyperfilelens_deploy ~/.ssh/known_hosts

      - name: Stage Runtime Configuration
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          HFL_INSECURE_TLS: ${{ inputs.hfl_insecure_tls }}
          HFL_PLATFORM_GATEWAY_AUTO_DEPLOY: ${{ inputs.platform_gateway_auto_deploy }}
          TURNSTILE_SITE_KEY: ${{ inputs.turnstile_site_key }}
          TURNSTILE_SECRET_KEY: ${{ secrets.turnstile_secret_key }}
          TURNSTILE_ENABLED: ${{ inputs.turnstile_enabled }}
          SMTP_HOST: ${{ inputs.smtp_host }}
          SMTP_PORT: ${{ inputs.smtp_port }}
          SMTP_USERNAME: ${{ inputs.smtp_username }}
          SMTP_PASSWORD: ${{ secrets.smtp_password }}
          SMTP_SECURITY: ${{ inputs.smtp_security }}
          EMAIL_FROM: ${{ inputs.email_from }}
          HFL_EMAIL_SIGNUP_ENABLED: ${{ inputs.email_signup_enabled }}
          HFL_EMAIL_CODE_LOGIN_ENABLED: ${{ inputs.email_code_login_enabled }}
          HFL_GOOGLE_OAUTH_ENABLED: ${{ inputs.google_oauth_enabled }}
          HFL_GA_MEASUREMENT_ID: ${{ inputs.ga_measurement_id }}
          SENTRY_ENABLED: ${{ inputs.sentry_enabled }}
          SENTRY_BACKEND_DSN: ${{ secrets.sentry_backend_dsn }}
          SENTRY_FRONTEND_DSN: ${{ secrets.sentry_frontend_dsn }}
          GOOGLE_CLIENT_ID: ${{ inputs.google_client_id }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.google_client_secret }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_env="$RUNNER_TEMP/hyperfilelens-runtime.env"
          trap 'rm -f -- "$runtime_env"' EXIT
          umask 077
          python3 - "$runtime_env" <<'PY'
          import os
          import pathlib
          import re
          import sys

          ga4_measurement_id_pattern = re.compile(r"^G-[A-Z0-9]+$")
          names = (
              "HFL_EMAIL_SIGNUP_ENABLED",
              "HFL_EMAIL_CODE_LOGIN_ENABLED",
              "HFL_GOOGLE_OAUTH_ENABLED",
              "HFL_GA_MEASUREMENT_ID",
              "HFL_INSECURE_TLS",
              "HFL_PLATFORM_GATEWAY_AUTO_DEPLOY",
              "HFL_DEPLOY_TARGET",
              "SENTRY_ENABLED",
              "SENTRY_BACKEND_DSN",
              "SENTRY_FRONTEND_DSN",
              "SENTRY_ENVIRONMENT",
              "SENTRY_TRACES_SAMPLE_RATE",
              "TURNSTILE_ENABLED",
              "TURNSTILE_SITE_KEY",
              "TURNSTILE_SECRET_KEY",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_SECURITY",
              "EMAIL_FROM",
              "GOOGLE_CLIENT_ID",
              "GOOGLE_CLIENT_SECRET",
          )
          lines = []
          for name in names:
              value = os.environ.get(name, "")
              if name == "HFL_DEPLOY_TARGET":
                  value = os.environ.get("DEPLOY_TARGET", "")
              elif name == "SENTRY_ENVIRONMENT":
                  target = os.environ.get("DEPLOY_TARGET", "")
                  value = {
                      "test": "hfl-test",
                      "community": "hfl-community",
                      "prod": "hfl-production",
                  }.get(target, "")
              elif name == "SENTRY_TRACES_SAMPLE_RATE":
                  # Error tracking is enabled by default; performance tracing is opt-in.
                  value = "0"
              if name == "HFL_GA_MEASUREMENT_ID":
                  if os.environ.get("DEPLOY_TARGET") != "prod":
                      value = ""
                  else:
                      candidate = value.strip(" \t")
                      if value and (
                          "\r" in value
                          or "\n" in value
                          or "\x00" in value
                          or not ga4_measurement_id_pattern.fullmatch(candidate)
                      ):
                          print(
                              "::warning title=Google Analytics configuration::"
                              "Invalid GA4 measurement ID; analytics will be disabled "
                              "and deployment will continue."
                          )
                          value = ""
                      else:
                          value = candidate
              if "\r" in value or "\n" in value or "\x00" in value:
                  print(
                      f"::warning title=Optional deployment configuration::{name} "
                      "is not single-line and was omitted; installed configuration will be preserved."
                  )
                  continue
              lines.append(f"{name}={value}")
          pathlib.Path(sys.argv[1]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "umask 077 && cat > /var/tmp/hyperfilelens-runtime-${GITHUB_RUN_ID}.env && chmod 0600 /var/tmp/hyperfilelens-runtime-${GITHUB_RUN_ID}.env" \
            < "$runtime_env"

      - name: Download and Install Release
        shell: bash
        run: |
          set -euo pipefail
          download_proxy_args=()
          if [[ -n "$RELEASE_DOWNLOAD_PROXY_URL" && "$RELEASE_DOWNLOAD_PROXY_URL" != "UNCONFIGURED" ]]; then
            download_proxy_args=(--download-proxy-url "$RELEASE_DOWNLOAD_PROXY_URL")
          fi
          package_args=()
          if [[ "${{ inputs.package_source }}" == "host-store" ]]; then
            version="${{ inputs.tag }}"
            version="${version#v}"
            package_args=(--package-file "/root/hfl-release/${{ inputs.tag }}/hyperfilelens-${version}-ee.tar.gz")
          fi
          printf -v remote_command '%q ' \
            bash -s -- \
              --tag "${{ inputs.tag }}" \
              --channel "${{ inputs.channel }}" \
              --public-url "$APP_PUBLIC_URL" \
              --admin-public-url "$ADMIN_PUBLIC_URL" \
              --direct-host "$DEPLOY_SSH_HOST" \
              --install-dir /opt/hyperfilelens \
              "${download_proxy_args[@]}" \
              "${package_args[@]}" \
              --runtime-env-file "/var/tmp/hyperfilelens-runtime-${GITHUB_RUN_ID}.env"
          ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "$remote_command" \
            < .github/scripts/remote-deploy.sh

      - name: Remove Staged Runtime Configuration
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f ~/.ssh/hyperfilelens_deploy ]]; then
            ssh -i ~/.ssh/hyperfilelens_deploy \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              -o TCPKeepAlive=yes \
              -p "$DEPLOY_SSH_PORT" \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              rm -f -- "/var/tmp/hyperfilelens-runtime-${GITHUB_RUN_ID}.env"
          fi

      - name: Verify Internal Health
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            'curl -kfsS https://127.0.0.1:11442/en/ >/dev/null && curl -kfsS https://127.0.0.1:11443/health/ready >/dev/null && curl -kfsS https://127.0.0.1:11444/ >/dev/null && curl -kfsS https://127.0.0.1:11445/ >/dev/null'

      - name: Ensure Platform Gateway
        if: ${{ inputs.platform_gateway_auto_deploy }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            'if /opt/hyperfilelens/install.sh platform-gateway verify --required --timeout 0; then
               echo "Installer-managed Platform Gateway is already online; preserving its independent lifecycle."
             else
               /opt/hyperfilelens/install.sh platform-gateway ensure
             fi'

      - name: Verify Platform Gateway Readiness
        if: ${{ inputs.platform_gateway_auto_deploy }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            '/opt/hyperfilelens/install.sh platform-gateway verify --required --timeout 180'
          printf '### Platform Gateway readiness\n\nPassed: the managed Agent WebSocket and LensNode sidecar are online and usable.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Optional Identity and Email Services
        shell: bash
        run: |
          set +e
          output="$(ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            '/opt/hyperfilelens/install.sh manage ensure_deployment_identity_settings' \
            2>&1)"
          command_status=$?
          set -e
          printf '%s\n' "$output"
          if (( command_status != 0 )); then
            echo '::warning title=Optional service configuration::Unable to synchronize optional signup, Google OAuth, Turnstile, or SMTP settings; core deployment remains healthy.'
            printf '### Optional service configuration\n\nWarning: optional identity or email settings could not be synchronized. Core deployment remains healthy.\n' >> "$GITHUB_STEP_SUMMARY"
          elif grep -F 'HFL_IDENTITY_STATUS=warning' <<<"$output" >/dev/null; then
            echo '::warning title=Optional service configuration::One or more optional settings were invalid and the installed values were preserved.'
            printf '### Optional service configuration\n\nWarning: invalid optional settings were preserved without blocking deployment.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Optional service configuration\n\nPassed: deployment-managed signup, Google OAuth, Turnstile, and SMTP settings were synchronized without external connectivity checks.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Check Google OAuth Readiness
        shell: bash
        run: |
          set +e
          output="$(ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            '/opt/hyperfilelens/install.sh manage check_google_oauth_readiness' \
            2>&1)"
          command_status=$?
          set -e
          printf '%s\n' "$output"
          if (( command_status != 0 )); then
            echo '::warning title=Google OAuth readiness::The local Google OAuth route or callback is not ready; core deployment remains healthy.'
            printf '### Google OAuth readiness\n\nWarning: the local OAuth route or generated callback is not ready. Google Cloud callback authorization was not tested.\n' >> "$GITHUB_STEP_SUMMARY"
          elif grep -F 'HFL_GOOGLE_OAUTH_STATUS=disabled' <<<"$output" >/dev/null; then
            printf '### Google OAuth readiness\n\nSkipped: Google OAuth is disabled.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Google OAuth readiness\n\nPassed: the local OAuth route redirects to Google with the configured callback. Google Cloud callback authorization was not tested.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Configure Default AI Model
        env:
          AI_MODEL_PROVIDER: ${{ inputs.ai_model_provider }}
          AI_MODEL_ID: ${{ inputs.ai_model_id }}
          AI_MODEL_DISPLAY_NAME: ${{ inputs.ai_model_display_name }}
          AI_MODEL_API_BASE: ${{ secrets.ai_model_api_base }}
          AI_MODEL_API_KEY: ${{ secrets.ai_model_api_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AI_MODEL_PROVIDER" ]]; then
            printf '### AI model deployment\n\nSkipped: deployment-managed AI model is not configured.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          payload="$RUNNER_TEMP/hyperfilelens-ai-model.json"
          trap 'rm -f -- "$payload"' EXIT
          umask 077
          python3 - "$payload" <<'PY'
          import json
          import os
          import pathlib
          import sys

          payload = {
              "provider": os.environ["AI_MODEL_PROVIDER"],
              "role": "agent",
              "model_id": os.environ["AI_MODEL_ID"],
              "display_name": os.environ["AI_MODEL_DISPLAY_NAME"],
              "api_base": os.environ["AI_MODEL_API_BASE"],
              "api_key": os.environ["AI_MODEL_API_KEY"],
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload), encoding="utf-8")
          PY
          chmod 0600 "$payload"

          set +e
          output="$(ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            '/opt/hyperfilelens/install.sh manage ensure_platform_ai_model' \
            < "$payload" 2>&1)"
          command_status=$?
          set -e
          printf '%s\n' "$output"
          if (( command_status != 0 )); then
            echo '::error title=AI model deployment::Unable to apply the configured deployment-managed model.'
            printf '### AI model deployment\n\nFailed: configured model could not be created or updated.\n' >> "$GITHUB_STEP_SUMMARY"
            exit "$command_status"
          elif grep -F 'HFL_AI_MODEL_APPLIED=false' <<<"$output" >/dev/null; then
            echo '::error title=AI model deployment::The required Agent model candidate was rejected and the installed model was preserved.'
            printf '### AI model deployment\n\nFailed: required Agent model validation failed; the installed model was preserved.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif grep -F 'HFL_AI_MODEL_CONNECTIVITY=failed' <<<"$output" >/dev/null; then
            echo '::error title=AI model connectivity::The required Agent model failed connectivity validation.'
            printf '### AI model deployment\n\nFailed: required Agent model connectivity validation failed.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            printf '### AI model deployment\n\nPassed: deployment-managed model was applied and tested successfully.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Default Multimodal Model
        env:
          AI_MULTIMODAL_MODEL_PROVIDER: ${{ inputs.ai_multimodal_model_provider }}
          AI_MULTIMODAL_MODEL_ID: ${{ inputs.ai_multimodal_model_id }}
          AI_MULTIMODAL_MODEL_DISPLAY_NAME: ${{ inputs.ai_multimodal_model_display_name }}
          AI_MODEL_API_BASE: ${{ secrets.ai_model_api_base }}
          AI_MODEL_API_KEY: ${{ secrets.ai_model_api_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AI_MULTIMODAL_MODEL_PROVIDER" ]]; then
            printf '### Multimodal model deployment\n\nSkipped: deployment-managed multimodal model is not configured. Text Chat remains available.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          multimodal_values=(
            "$AI_MULTIMODAL_MODEL_PROVIDER"
            "$AI_MULTIMODAL_MODEL_ID"
            "$AI_MULTIMODAL_MODEL_DISPLAY_NAME"
            "$AI_MODEL_API_BASE"
            "$AI_MODEL_API_KEY"
          )
          for value in "${multimodal_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo '::warning title=Multimodal model configuration::Configuration is incomplete; the installed multimodal default will be preserved.'
              printf '### Multimodal model deployment\n\nWarning: incomplete configuration was ignored. Text Chat remains available.\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          if [[ ! "$AI_MULTIMODAL_MODEL_PROVIDER" =~ ^[a-z0-9_]+$ ]] \
            || [[ "$AI_MODEL_API_BASE" != https://* ]] \
            || [[ "$AI_MULTIMODAL_MODEL_ID" == *$'\n'* || "$AI_MULTIMODAL_MODEL_ID" == *$'\r'* ]] \
            || [[ "$AI_MULTIMODAL_MODEL_DISPLAY_NAME" == *$'\n'* || "$AI_MULTIMODAL_MODEL_DISPLAY_NAME" == *$'\r'* ]] \
            || [[ "$AI_MODEL_API_BASE" == *$'\n'* || "$AI_MODEL_API_BASE" == *$'\r'* ]] \
            || [[ "$AI_MODEL_API_KEY" == *$'\n'* || "$AI_MODEL_API_KEY" == *$'\r'* ]]; then
            echo '::warning title=Multimodal model configuration::Configuration is malformed; the installed multimodal default will be preserved.'
            printf '### Multimodal model deployment\n\nWarning: malformed configuration was ignored. Text Chat remains available.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          payload="$RUNNER_TEMP/hyperfilelens-multimodal-model.json"
          trap 'rm -f -- "$payload"' EXIT
          umask 077
          python3 - "$payload" <<'PY'
          import json
          import os
          import pathlib
          import sys

          payload = {
              "role": "multimodal",
              "provider": os.environ["AI_MULTIMODAL_MODEL_PROVIDER"],
              "model_id": os.environ["AI_MULTIMODAL_MODEL_ID"],
              "display_name": os.environ["AI_MULTIMODAL_MODEL_DISPLAY_NAME"],
              "api_base": os.environ["AI_MODEL_API_BASE"],
              "api_key": os.environ["AI_MODEL_API_KEY"],
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload), encoding="utf-8")
          PY
          chmod 0600 "$payload"

          set +e
          output="$(ssh -i ~/.ssh/hyperfilelens_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$DEPLOY_SSH_PORT" \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            '/opt/hyperfilelens/install.sh manage ensure_platform_ai_model' \
            < "$payload" 2>&1)"
          command_status=$?
          set -e
          printf '%s\n' "$output"
          if (( command_status != 0 )); then
            echo '::warning title=Multimodal model deployment::Unable to apply the optional model; the installed default was preserved when available.'
            printf '### Multimodal model deployment\n\nWarning: configured model could not be applied. Text Chat remains available.\n' >> "$GITHUB_STEP_SUMMARY"
          elif grep -F 'HFL_AI_MODEL_APPLIED=false' <<<"$output" >/dev/null; then
            echo '::warning title=Multimodal model connectivity::The candidate failed validation; the installed default was preserved.'
            printf '### Multimodal model deployment\n\nWarning: candidate validation failed and the installed default was preserved. Text Chat remains available.\n' >> "$GITHUB_STEP_SUMMARY"
          elif grep -F 'HFL_AI_MODEL_CONNECTIVITY=failed' <<<"$output" >/dev/null; then
            echo '::warning title=Multimodal model connectivity::The installed model failed its connectivity recheck. Text Chat remains available.'
            printf '### Multimodal model deployment\n\nWarning: the installed model failed its connectivity recheck.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Multimodal model deployment\n\nPassed: deployment-managed multimodal model was applied successfully.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check Public Endpoint
        run: ./.github/scripts/check-public-endpoint.sh

      - name: Record Sentry Deployment
        env:
          SENTRY_ENABLED: ${{ inputs.sentry_enabled }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_BACKEND_PROJECT: ${{ vars.SENTRY_BACKEND_PROJECT }}
          SENTRY_FRONTEND_PROJECT: ${{ vars.SENTRY_FRONTEND_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry_auth_token }}
          DEPLOY_TARGET: ${{ inputs.target }}
          ARTIFACT_ID: ${{ inputs.tag }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          if os.environ.get("SENTRY_ENABLED", "").lower() != "true":
              print("Sentry deployment marker skipped: reporting is disabled.")
              raise SystemExit(0)
          url = os.environ.get("SENTRY_URL", "").rstrip("/")
          org = os.environ.get("SENTRY_ORG", "")
          backend_project = os.environ.get("SENTRY_BACKEND_PROJECT", "")
          frontend_project = os.environ.get("SENTRY_FRONTEND_PROJECT", "")
          token = os.environ.get("SENTRY_AUTH_TOKEN", "")
          if not all((url, org, backend_project, frontend_project, token)):
              print("::notice title=Sentry deployment::Deployment markers are skipped until organization, project, and token settings are complete; runtime DSN reporting is unaffected.")
              raise SystemExit(0)

          artifact = os.environ.get("ARTIFACT_ID", "").removeprefix("v")
          hfl_artifact = artifact
          if os.environ.get("PACKAGE_SOURCE") == "host-store":
              hfl_artifact += "-ee"
          defaults = pathlib.Path("tools/sourcelens/defaults.env").read_text(encoding="utf-8")
          match = re.search(r"SOURCELENS_GIT_REF=.*?v(\d+\.\d+\.\d+)", defaults)
          sl_version = match.group(1) if match else "unknown"
          releases = (
              (f"hyperfilelens-backend@{hfl_artifact}", backend_project),
              (f"hyperfilelens-frontend@{hfl_artifact}", frontend_project),
              (f"hyperfilelens-sourcelens@{artifact}-sl{sl_version}", backend_project),
              (f"hyperfilelens-sourcelens-frontend@{artifact}-sl{sl_version}", frontend_project),
              (f"hyperfilelens-agent@{artifact}", backend_project),
              (f"hyperfilelens-lensnode@{artifact}-sl{sl_version}", backend_project),
          )
          environment = {
              "test": "hfl-test",
              "community": "hfl-community",
              "prod": "hfl-production",
          }[os.environ["DEPLOY_TARGET"]]
          failed = []
          release_endpoint = (
              f"{url}/api/0/organizations/{urllib.parse.quote(org, safe='')}/releases/"
          )
          for release, project in releases:
              create_request = urllib.request.Request(
                  release_endpoint,
                  data=json.dumps({"version": release, "projects": [project]}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(create_request, timeout=15) as response:
                      response.read()
              except urllib.error.HTTPError as exc:
                  if exc.code not in {208, 409}:
                      failed.append(f"{release} create: HTTP {exc.code}")
              except (OSError, urllib.error.URLError) as exc:
                  failed.append(f"{release} create: {type(exc).__name__}")
              endpoint = (
                  f"{url}/api/0/organizations/{urllib.parse.quote(org, safe='')}/releases/"
                  f"{urllib.parse.quote(release, safe='')}/deploys/"
              )
              payload = json.dumps({"environment": environment, "name": environment}).encode()
              request = urllib.request.Request(
                  endpoint,
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      response.read()
              except (OSError, urllib.error.URLError, urllib.error.HTTPError) as exc:
                  failed.append(f"{release}: {type(exc).__name__}")
          if failed:
              print("::warning title=Sentry deployment::Some deployment markers failed; continuing: " + ", ".join(failed))
          else:
              print(f"Recorded {len(releases)} Sentry releases in {environment}.")
          PY
          exit 0
