      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CN_REGISTRY_HOST }}
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}
      - name: Prepare asset image context
        run: >-
          ./release/ci/prepare-saas-asset-context.sh agent
          build/saas-input "${{ needs.prepare.outputs.version }}"
          "build/saas-agent"
      - name: Build and publish global asset image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: build/saas-agent
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_PREFIX }}/hyperfilelens-agent-assets:${{ needs.prepare.outputs.version }}
      - name: Mirror immutable asset image to CN
        run: |
          ./release/ci/mirror-saas-image.sh \
            "$REGISTRY_PREFIX/hyperfilelens-agent-assets:${{ needs.prepare.outputs.version }}" \
            "${{ steps.build.outputs.digest }}" \
            "$CN_REGISTRY_PREFIX/hyperfilelens-agent-assets:${{ needs.prepare.outputs.version }}"
      - name: Record asset metadata
        shell: bash
        run: |
          ./release/ci/write-saas-image-metadata.sh \
            "agent-assets" \
            "$REGISTRY_PREFIX/hyperfilelens-agent-assets:${{ needs.prepare.outputs.version }}" \
            "$CN_REGISTRY_PREFIX/hyperfilelens-agent-assets:${{ needs.prepare.outputs.version }}" \
            "${{ steps.build.outputs.digest }}" \
            "hyperfilelens-agent-assets:${{ needs.prepare.outputs.version }}" \
            "agent-assets" \
            "agent-assets.json"
          jq --arg kind agent '. + {asset_kind: $kind}' \
            "agent-assets.json" > metadata.json
          mv metadata.json "agent-assets.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saas-metadata-agent-assets
          path: agent-assets.json
          retention-days: 3

