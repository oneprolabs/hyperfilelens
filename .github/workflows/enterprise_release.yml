name: HFL - Enterprise Release & Deploy
run-name: Enterprise · ${{ inputs.tag }} · Release & Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing OSS and EE tag to rebuild (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-enterprise-build:
    name: Validate · Enterprise build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate trusted trigger
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::Enterprise builds must be started from the main branch"
            exit 1
          }

  build-enterprise:
    name: Build & Deploy · Enterprise
    needs: validate-enterprise-build
    uses: ./.github/workflows/release_pipeline.yml
    with:
      channel: release
      edition: enterprise
      release_tag: ${{ inputs.tag }}
    secrets: inherit
