name: Diagnose CN registry upload route

on:
  push:
    branches:
      - fix/registry-mirror-transport
    paths:
      - .github/workflows/registry_mirror_diagnostics.yml

permissions:
  contents: read

jobs:
  gateway-via-test:
    name: Copy Gateway through TEST TCP relay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_DIGEST: sha256:e626773d47c86e27132cec87f9f68c797424672b069271a3b7ee7a7f47bf77a9
      GODEBUG: http2client=0
    steps:
      - name: Install diagnostic client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}
      - name: Stage and verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          timeout 5m skopeo copy --preserve-digests \
            --authfile "$HOME/.docker/config.json" \
            "docker://docker.io/oneprolabs/hyperfilelens-gateway-assets@$EXPECTED_DIGEST" \
            "dir:$RUNNER_TEMP/gateway-image"
          [[ "sha256:$(sha256sum "$RUNNER_TEMP/gateway-image/manifest.json" | cut -d' ' -f1)" == "$EXPECTED_DIGEST" ]]
      - name: Open a TCP relay without running commands on TEST
        env:
          SSH_HOST: ${{ vars.TEST_SSH_HOST }}
          SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          SSH_USER: ${{ vars.TEST_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.TEST_SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ -n "$SSH_KNOWN_HOSTS" && -n "$SSH_KEY" ]]
          umask 077
          printf '%s\n' "$SSH_KEY" >"$RUNNER_TEMP/relay-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$RUNNER_TEMP/relay-known-hosts"
          sudo ssh -F /dev/null -fN -M -S "$RUNNER_TEMP/relay-control" \
            -i "$RUNNER_TEMP/relay-key" \
            -o "UserKnownHostsFile=$RUNNER_TEMP/relay-known-hosts" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -L 127.0.0.2:443:registry.cn-beijing.aliyuncs.com:443 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST"
          printf '127.0.0.2 registry.cn-beijing.aliyuncs.com\n' | sudo tee -a /etc/hosts >/dev/null
          getent ahostsv4 registry.cn-beijing.aliyuncs.com
      - name: Upload to a diagnostic tag with TLS verification retained
        shell: bash
        run: |
          set -euo pipefail
          destination="registry.cn-beijing.aliyuncs.com/oneprolabs/hyperfilelens-gateway-assets:diag-relay-$GITHUB_RUN_ID"
          timeout 10m skopeo copy --preserve-digests \
            --authfile "$HOME/.docker/config.json" \
            "dir:$RUNNER_TEMP/gateway-image" "docker://$destination"
          actual="sha256:$(timeout 60s skopeo inspect --raw \
            --authfile "$HOME/.docker/config.json" "docker://$destination" \
            | sha256sum | cut -d' ' -f1)"
          [[ "$actual" == "$EXPECTED_DIGEST" ]]
          printf 'Verified relay copy digest: %s\n' "$actual"
      - name: Close relay and remove temporary credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -S "$RUNNER_TEMP/relay-control" ]]; then
            sudo ssh -F /dev/null -S "$RUNNER_TEMP/relay-control" -O exit unused || true
          fi
          rm -f -- "$RUNNER_TEMP/relay-key" "$RUNNER_TEMP/relay-known-hosts"
