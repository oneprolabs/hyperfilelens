name: Diagnose staged registry copy

on:
  push:
    branches:
      - fix/registry-mirror-transport
    paths:
      - .github/workflows/registry_mirror_diagnostics.yml

permissions:
  contents: read

jobs:
  staged-gateway:
    name: Stage and copy Gateway assets
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPOSITORY: hyperfilelens-gateway-assets
      EXPECTED_DIGEST: sha256:e626773d47c86e27132cec87f9f68c797424672b069271a3b7ee7a7f47bf77a9
      GODEBUG: http2client=0
    steps:
      - name: Install the registry copy diagnostic tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo --version
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.CN_REGISTRY_USERNAME }}
          password: ${{ secrets.CN_REGISTRY_PASSWORD }}
      - name: Download and verify the complete immutable source
        shell: bash
        run: |
          set -euo pipefail
          source="docker.io/oneprolabs/$REPOSITORY@$EXPECTED_DIGEST"
          started=$SECONDS
          timeout 10m skopeo copy --preserve-digests \
            --authfile "$HOME/.docker/config.json" \
            "docker://$source" "dir:$RUNNER_TEMP/gateway-image"
          actual="sha256:$(sha256sum "$RUNNER_TEMP/gateway-image/manifest.json" | cut -d' ' -f1)"
          [[ "$actual" == "$EXPECTED_DIGEST" ]]
          printf 'Source staged and verified in %ss: %s\n' "$((SECONDS-started))" "$actual"
      - name: Upload staged source to a diagnostic tag and verify
        shell: bash
        run: |
          set -euo pipefail
          destination="registry.cn-beijing.aliyuncs.com/oneprolabs/$REPOSITORY:diag-staged-$GITHUB_RUN_ID"
          started=$SECONDS
          timeout 10m skopeo copy --preserve-digests \
            --authfile "$HOME/.docker/config.json" \
            "dir:$RUNNER_TEMP/gateway-image" "docker://$destination"
          actual="sha256:$(timeout 60s skopeo inspect --raw \
            --authfile "$HOME/.docker/config.json" \
            "docker://$destination" | sha256sum | cut -d' ' -f1)"
          [[ "$actual" == "$EXPECTED_DIGEST" ]]
          printf 'Destination copied and verified in %ss: %s\n' "$((SECONDS-started))" "$actual"
          printf '## Gateway staged copy\n\nBoth phases passed; source and destination digest: `%s`.\n' \
            "$actual" >>"$GITHUB_STEP_SUMMARY"
