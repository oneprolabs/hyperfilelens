name: HFL - Build & Package (Reusable)

on:
  workflow_call:
    inputs:
      channel:
        description: Artifact channel requested by a trusted wrapper
        required: true
        type: string
      edition:
        description: Product edition to package
        required: false
        default: community
        type: string
      release_tag:
        description: Existing OSS release tag used as the immutable source baseline
        required: true
        type: string
concurrency:
  group: ${{ format('hyperfilelens-package-{0}', inputs.release_tag) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
  REGISTRY_PREFIX: ${{ format('{0}/{1}', vars.REGISTRY_HOST, vars.REGISTRY_NAMESPACE) }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_version: ${{ steps.version.outputs.image_version }}
      tag: ${{ steps.version.outputs.tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      commit: ${{ steps.version.outputs.commit }}
      channel: ${{ steps.version.outputs.channel }}
      edition: ${{ steps.version.outputs.edition }}
      enterprise_commit: ${{ steps.enterprise-ref.outputs.commit }}
      enterprise_stored: ${{ steps.enterprise-store.outputs.stored }}
      build_required: ${{ steps.candidate.outputs.build_required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Validate release tag and commit
        id: version
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_EDITION: ${{ inputs.edition }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_CHANNEL" == "release" ]]
          [[ "$REQUESTED_EDITION" =~ ^(community|enterprise)$ ]]
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          VERSION="${BASH_REMATCH[1]}"
          IMAGE_VERSION="$VERSION"
          [[ "$REQUESTED_EDITION" == "community" ]] || IMAGE_VERSION="${VERSION}-ee"
          git fetch origin main --no-tags
          COMMIT="$(git rev-parse --verify "${TAG}^{commit}")"
          git merge-base --is-ancestor "$COMMIT" origin/main
          CANDIDATE_TAG="$TAG"
          if [[ "$REQUESTED_EDITION" == "enterprise" ]]; then
            CANDIDATE_TAG="enterprise-${TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          {
            echo "version=$VERSION"
            echo "image_version=$IMAGE_VERSION"
            echo "tag=$CANDIDATE_TAG"
            echo "release_tag=$TAG"
            echo "commit=$COMMIT"
            echo "channel=$REQUESTED_CHANNEL"
            echo "edition=$REQUESTED_EDITION"
          } >> "$GITHUB_OUTPUT"
          [[ "${REGISTRY_HOST}" =~ ^[a-z0-9][a-z0-9.-]*(:[0-9]+)?$ ]] || {
            echo "REGISTRY_HOST repository variable is missing or invalid" >&2
            exit 1
          }
          [[ "${REGISTRY_NAMESPACE}" =~ ^[a-z0-9][a-z0-9._/-]*$ && "${REGISTRY_NAMESPACE}" != */ && "${REGISTRY_NAMESPACE}" != *//* ]] || {
            echo "REGISTRY_NAMESPACE repository variable is missing or invalid" >&2
            exit 1
          }

      - name: Validate matching Enterprise tag
        id: enterprise-ref
        if: ${{ steps.version.outputs.edition == 'enterprise' }}
        env:
          ENTERPRISE_EXTENSION_REPOSITORY: ${{ vars.ENTERPRISE_EXTENSION_REPOSITORY }}
          HFL_EXTENSION_GIT_TOKEN: ${{ secrets.ENTERPRISE_EXTENSION_GIT_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ENTERPRISE_EXTENSION_REPOSITORY" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$ ]] || {
            echo 'ENTERPRISE_EXTENSION_REPOSITORY must be a credential-free GitHub HTTPS repository URL' >&2
            exit 1
          }
          enterprise_commit="$(python3 - "$ENTERPRISE_EXTENSION_REPOSITORY" "$RELEASE_TAG" <<'PY'
          import re
          import subprocess
          import sys

          from tools.extensions.materialize_extensions import _git_env

          repository, tag = sys.argv[1:]
          result = subprocess.run(
              [
                  "git",
                  "ls-remote",
                  "--exit-code",
                  repository,
                  f"refs/tags/{tag}",
                  f"refs/tags/{tag}^{{}}",
              ],
              check=True,
              env=_git_env(repository, require_https_auth=True),
              stdout=subprocess.PIPE,
              text=True,
          )
          refs = {}
          for line in result.stdout.splitlines():
              commit, ref = line.split("\t", 1)
              refs[ref] = commit
          commit = refs.get(f"refs/tags/{tag}^{{}}") or refs.get(f"refs/tags/{tag}")
          if not commit or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Enterprise tag did not resolve to one commit")
          print(commit)
          PY
          )"
          echo "commit=$enterprise_commit" >> "$GITHUB_OUTPUT"

      - name: Check immutable Enterprise store
        id: enterprise-store
        if: ${{ steps.version.outputs.edition == 'enterprise' }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          ENTERPRISE_COMMIT: ${{ steps.enterprise-ref.outputs.commit }}
          TEST_SSH_HOST: ${{ vars.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ vars.TEST_SSH_USER }}
          TEST_SSH_KNOWN_HOSTS: ${{ vars.TEST_SSH_KNOWN_HOSTS }}
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEST_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$TEST_SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$TEST_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$TEST_SSH_KNOWN_HOSTS" && -n "$TEST_SSH_PRIVATE_KEY" ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$TEST_SSH_PRIVATE_KEY" > ~/.ssh/hyperfilelens_test
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/hyperfilelens_test
          stored="$({
            ssh -i ~/.ssh/hyperfilelens_test \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -p "$TEST_SSH_PORT" "$TEST_SSH_USER@$TEST_SSH_HOST" \
              "bash -s -- '$RELEASE_TAG' '$RELEASE_COMMIT' '$ENTERPRISE_COMMIT'" <<'REMOTE'
          set -euo pipefail
          tag=$1
          oss_commit=$2
          enterprise_commit=$3
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          version=${BASH_REMATCH[1]}
          directory="/root/hfl-release/${tag}"
          exec 9>/root/hfl-release/.lock
          flock -s 9
          if [[ ! -e "$directory" ]]; then
            printf 'false\n'
            exit 0
          fi
          [[ -d "$directory" && ! -L "$directory" ]]
          [[ -f "$directory/SHA256SUMS" && ! -L "$directory/SHA256SUMS" ]]
          [[ -f "$directory/MANIFEST.json" && ! -L "$directory/MANIFEST.json" ]]
          [[ -f "$directory/hyperfilelens-${version}-ee.tar.gz" \
            && ! -L "$directory/hyperfilelens-${version}-ee.tar.gz" ]]
          (
            cd "$directory"
            sha256sum -c SHA256SUMS >/dev/null
            python3 - MANIFEST.json "$tag" "$version" "$oss_commit" "$enterprise_commit" <<'PY'
          import json
          import pathlib
          import sys

          path, tag, version, oss_commit, enterprise_commit = sys.argv[1:]
          manifest = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          expected = {
              "product": "hyperfilelens",
              "edition": "enterprise",
              "version": version,
              "artifact_id": tag,
              "image_version": f"{version}-ee",
              "git_commit": oss_commit,
              "extension_commit": enterprise_commit,
          }
          differences = [key for key, value in expected.items() if manifest.get(key) != value]
          if differences:
              raise SystemExit(
                  "stored Enterprise release identity differs for: " + ", ".join(differences)
              )
          PY
          )
          printf 'true\n'
          REMOTE
          } 2>&1)" || {
            printf '%s\n' "$stored" >&2
            exit 1
          }
          [[ "$stored" =~ ^(true|false)$ ]]
          echo "stored=$stored" >> "$GITHUB_OUTPUT"

      - name: Create or reuse build candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_CHANNEL: ${{ steps.version.outputs.channel }}
          ARTIFACT_ID: ${{ steps.version.outputs.tag }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_EDITION: ${{ steps.version.outputs.edition }}
          RELEASE_COMMIT: ${{ steps.version.outputs.commit }}
          ENTERPRISE_STORED: ${{ steps.enterprise-store.outputs.stored }}
        shell: bash
        run: |
          set -euo pipefail
          validate_build_contract() {
            local file
            local -a required_files=(
              release/ci/assemble-release.sh
              release/build.sh
              tools/extensions/materialize_extensions.py
              tools/lib/version.sh
              tools/quality/test-enterprise-release-flow.sh
            )
            for file in "${required_files[@]}"; do
              [[ -f "$file" ]] || {
                echo "::error::Selected tag predates the edition-aware release contract: missing $file"
                return 1
              }
            done
            grep -F -- '--edition' release/ci/assemble-release.sh >/dev/null
            grep -F 'HFL_RELEASE_EDITION' release/build.sh >/dev/null
            grep -F 'HFL_EXTENSION_EXPECTED_COMMIT' \
              tools/extensions/materialize_extensions.py >/dev/null
            grep -F 'normalize_edition' tools/lib/version.sh >/dev/null
          }
          if [[ "$RELEASE_EDITION" == "enterprise" ]]; then
            if [[ "$ENTERPRISE_STORED" == "true" ]]; then
              echo "build_required=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            validate_build_contract
            gh release create "$ARTIFACT_ID" \
              --target "$RELEASE_COMMIT" \
              --draft \
              --title "Enterprise build candidate $RELEASE_TAG"
            echo "build_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$ARTIFACT_ID" \
            --json isDraft,isPrerelease,targetCommitish \
            >/tmp/hfl-release.json 2>/dev/null; then
            if [[ "$ARTIFACT_CHANNEL" == "release" ]]; then
              if [[ "$(jq -r .isDraft /tmp/hfl-release.json)" == "true" ]]; then
                validate_build_contract
                echo "build_required=true" >> "$GITHUB_OUTPUT"
              else
                echo "build_required=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "build_required=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if [[ "$ARTIFACT_CHANNEL" == "release" ]]; then
              validate_build_contract
              gh release create "$ARTIFACT_ID" \
                --verify-tag \
                --draft \
                --generate-notes \
                --title "HyperFileLens $ARTIFACT_ID"
            fi
            echo "build_required=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: prepare
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hyperfilelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hyperfilelens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hyperfilelens
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CACHE_REDIS_URL: redis://127.0.0.1:6379/1
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: src/agent/go.mod
          cache-dependency-path: src/agent/go.sum
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.2"
          enable-cache: true

      - name: Materialize Enterprise extension for quality gates
        env:
          RELEASE_EDITION: ${{ needs.prepare.outputs.edition }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ENTERPRISE_COMMIT: ${{ needs.prepare.outputs.enterprise_commit }}
          ENTERPRISE_EXTENSION_REPOSITORY: ${{ vars.ENTERPRISE_EXTENSION_REPOSITORY }}
          HFL_EXTENSION_GIT_TOKEN: ${{ secrets.ENTERPRISE_EXTENSION_GIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EDITION" == "community" ]]; then
            echo "HFL_EXTENSIONS=" >>"$GITHUB_ENV"
            echo "Community quality gates: extensions disabled by edition"
            exit 0
          fi
          [[ "$ENTERPRISE_EXTENSION_REPOSITORY" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?$ ]] || {
            echo "::error::ENTERPRISE_EXTENSION_REPOSITORY must be a credential-free GitHub HTTPS repository URL"
            exit 1
          }
          token="${HFL_EXTENSION_GIT_TOKEN:-}"
          if [[ ${#token} -lt 20 || "$token" == "-" ]]; then
            echo "::error::ENTERPRISE_EXTENSION_GIT_TOKEN is missing or a placeholder; set a token with contents:read on the private extension repository"
            exit 1
          fi
          quality_dir="$GITHUB_WORKSPACE/build/quality/extensions"
          HFL_EXTENSION_GIT_TOKEN="$token" \
            python3 tools/extensions/materialize_extensions.py \
              --repo-root . \
              --sources "${ENTERPRISE_EXTENSION_REPOSITORY}@${RELEASE_TAG}" \
              --expected-commit "$ENTERPRISE_COMMIT" \
              --bake-dir "$quality_dir"
          extensions="$(
            find "$quality_dir" -mindepth 1 -maxdepth 1 -type d \
              -exec test -d '{}/src/backend' \; -print \
              | sort \
              | paste -sd, -
          )"
          [[ -n "$extensions" ]] || {
            echo "::error::Enterprise extension materialization produced no extension roots"
            exit 1
          }
          echo "HFL_EXTENSIONS=$extensions" >>"$GITHUB_ENV"
          echo "Enterprise quality gates: extension enabled"

      - name: Release and source checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/quality/check-english-source.py
          python3 -m unittest tools/quality/test_check_english_source.py
          python3 -m unittest tools/quality/test_agent_certification_gate.py
          uv run --isolated --no-project --python 3.8 python tools/quality/check-python38-runtime.py
          ./tools/quality/check-release-contracts.sh
          ./tools/quality/test-default-certificates.sh
          ./tools/quality/test-bootstrap-download-progress.sh
          HFL_TEST_BASH42=1 ./tools/quality/test-bootstrap-curl-tls-nounset.sh
          ./tools/quality/test-gateway-bootstrap-health.sh
          ./tools/quality/test-gateway-lifecycle-upgrade.sh
          ./tools/quality/test-platform-gateway-auto-deploy.sh
          ./tools/quality/test-agent-gateway-uninstall.sh
          ./tools/quality/test-installer-image-refresh.sh
          ./tools/quality/test-language-pack-runtime-index.sh
          ./tools/quality/test-docker-image-digest-alias.sh
          ./tools/quality/test-docker-pull-retry.sh
          ./tools/quality/test-gh-release-upload-retry.sh
          ./tools/quality/test-offline-docker-package-plan.sh
          ./tools/quality/test-upgrade-backup-retention.sh
          ./tools/quality/test-blue-green-recovery.sh
          ./tools/quality/test-sourcelens-runtime-sync.sh
          ./tools/quality/test-sourcelens-runtime-fingerprint.sh
          ./tools/quality/test-redis-rdb-preflight.sh
          ./tools/quality/test-agent-release-retention.sh
          ./tools/quality/test-managed-image-retention.sh
          ./tools/quality/test-enterprise-release-flow.sh
          ./tools/quality/test-shared-host-guard.sh
          ./tools/quality/test-release-download-proxy.sh
          ./tools/quality/test-public-endpoint-check.sh
          ./tools/quality/test-deployment-optional-config.sh
          ./tools/quality/test-website-runtime-config.sh
          ./tools/quality/test-ga-runtime-config.sh
          ./tools/quality/test-sentry-runtime-config.sh
          ./tools/quality/test-payload-tree-hash.sh
          ./tools/quality/test-ci-release-assembly.sh
          HFL_TEST_EDITION=enterprise ./tools/quality/test-ci-release-assembly.sh
          ./tools/quality/test-kopia-build-config.sh
          ./tools/quality/test-dev-stack-upgrade.sh
          ./tools/quality/test-sourcelens-git-mirror.sh
          ./tools/quality/test-sourcelens-submodule-recovery.sh
          git diff --check
          while IFS= read -r script; do bash -n "$script"; done < <(find . -path './build' -prune -o -path './data' -prune -o -type f -name '*.sh' -print)

      - name: Backend checks
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          uv run ruff check src/backend
          uv run python src/backend/manage.py makemigrations --check --dry-run
          uv run python src/backend/manage.py test
          if [[ -n "${HFL_EXTENSIONS:-}" ]]; then
            extension_test_labels=()
            IFS=',' read -r -a extension_roots <<<"$HFL_EXTENSIONS"
            for root in "${extension_roots[@]}"; do
              backend="$root/src/backend"
              while IFS= read -r test_dir; do
                label="${test_dir#"$backend/"}"
                extension_test_labels+=("${label//\//.}")
              done < <(
                find "$backend" -type d -name tests -exec test -f '{}/__init__.py' \; -print \
                  | sort
              )
            done
            ((${#extension_test_labels[@]} > 0)) || {
              echo "::error::Enterprise extension contains no discoverable backend tests"
              exit 1
            }
            uv run python src/backend/manage.py test "${extension_test_labels[@]}"
          fi

      - name: Frontend checks
        working-directory: src/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test:ci
          npm run build

      - name: Website checks
        working-directory: website
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Agent checks
        working-directory: src/agent
        run: go test ./...

  build-hfl-images:
    name: Build · HFL · ${{ matrix.component == 'hfl-backend' && 'backend' || 'frontend' }}
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [prepare, quality]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hfl-backend
            repository: hyperfilelens-backend
            context: .
            dockerfile: deploy/docker/backend.Dockerfile
            cache_scope: hfl-backend
            needs_kopia: true
          - component: hfl-frontend
            repository: hyperfilelens-frontend
            context: .
            dockerfile: deploy/docker/frontend.Dockerfile
            cache_scope: hfl-frontend
            needs_kopia: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.needs_kopia
        with:
          go-version-file: src/agent/go.mod
          cache: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Prepare pinned Kopia binary
        if: matrix.needs_kopia
        run: ./tools/kopia/prepare.sh --matrix linux:amd64

      - name: Prepare standalone Website artifact
        if: matrix.component == 'hfl-frontend'
        run: |
          ./website/build.sh \
            --output build/website \
            --image-tag "hyperfilelens-website-builder:${GITHUB_RUN_ID}" \
            --platform linux/amd64

      - name: Materialize Open Core extensions for image bake
        env:
          RELEASE_EDITION: ${{ needs.prepare.outputs.edition }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ENTERPRISE_COMMIT: ${{ needs.prepare.outputs.enterprise_commit }}
          ENTERPRISE_EXTENSION_REPOSITORY: ${{ vars.ENTERPRISE_EXTENSION_REPOSITORY }}
          HFL_EXTENSION_GIT_TOKEN: ${{ secrets.ENTERPRISE_EXTENSION_GIT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release/extensions
          : >build/release/extensions/.gitkeep
          if [[ "$RELEASE_EDITION" == "community" ]]; then
            echo "HFL_EXTENSIONS=" >>"${GITHUB_ENV}"
            echo "Community bake: extensions disabled by edition"
            exit 0
          fi
          [[ "$ENTERPRISE_EXTENSION_REPOSITORY" == https://github.com/* ]]
          HFL_EXTENSION_SOURCES="${ENTERPRISE_EXTENSION_REPOSITORY}@${RELEASE_TAG}"
          # Prefer packaging secret for private plugin repos; do not fall back to
          # github.token (that token cannot clone other private repositories).
          # Scope to HFL_EXTENSION_GIT_TOKEN only (materialize reads it first).
          token="${HFL_EXTENSION_GIT_TOKEN:-}"
          if [[ ${#token} -lt 20 || "${token}" == "-" ]]; then
            echo "::error::HFL_EXTENSION_GIT_TOKEN is missing or a placeholder; set a PAT with contents:read on the private extension repo"
            exit 1
          fi
          exts="$(
            HFL_EXTENSION_GIT_TOKEN="${token}" \
              python3 tools/extensions/materialize_extensions.py \
                --repo-root . \
                --sources "${HFL_EXTENSION_SOURCES}" \
                --expected-commit "${ENTERPRISE_COMMIT}" \
                --bake-dir build/release/extensions \
              --print-extensions
          )"
          echo "HFL_EXTENSIONS=${exts}" >>"${GITHUB_ENV}"
          echo "Enterprise bake: HFL_EXTENSIONS=${exts}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY_PREFIX }}/${{ matrix.repository }}:${{ needs.prepare.outputs.image_version }}
          build-args: |
            KOPIA_BINARY=build/kopia/dist/linux/amd64/kopia
            IMAGE_VERSION=${{ needs.prepare.outputs.image_version }}
            IMAGE_REVISION=${{ needs.prepare.outputs.commit }}
            PIP_TIMEOUT=600
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_FRONTEND_PROJECT=${{ vars.SENTRY_FRONTEND_PROJECT }}
            SENTRY_RELEASE=hyperfilelens-frontend@${{ needs.prepare.outputs.image_version }}
            VITE_SHOW_EULA=false
            HFL_EXTENSIONS=${{ env.HFL_EXTENSIONS }}
          secrets: ${{ matrix.component == 'hfl-frontend' && secrets.SENTRY_AUTH_TOKEN != '' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=min

      - name: Upload immutable image metadata
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ env.REGISTRY_PREFIX }}/${{ matrix.repository }}:${{ needs.prepare.outputs.image_version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          output="_internal-${{ matrix.component }}.json"
          ./release/ci/write-image-metadata.sh \
            "${{ matrix.component }}" "$IMAGE_REF" "$IMAGE_DIGEST" "$output"
          ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}" "$output" --clobber

      - name: Disk report
        if: always()
        run: |
          docker image rm "hyperfilelens-website-builder:${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          df -h
          docker system df || true

  build-sourcelens-images:
    name: Build · SourceLens · ${{ matrix.component }}
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [prepare, quality]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, lensnode]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push bundled SourceLens component
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_FRONTEND_PROJECT: ${{ vars.SENTRY_FRONTEND_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./release/ci/build-sourcelens-image.sh \
            "${{ matrix.component }}" \
            "$REGISTRY_PREFIX" \
            "${{ needs.prepare.outputs.version }}" \
            "_internal-sourcelens-${{ matrix.component }}.json"

      - name: Upload immutable image metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}" \
            "_internal-sourcelens-${{ matrix.component }}.json" --clobber

      - name: Disk report and cleanup
        if: always()
        run: |
          df -h
          docker system df || true
          docker builder prune -af || true

  build-agent:
    name: Build · Agent · ${{ matrix.asset }}
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [prepare, quality]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux:amd64
            asset: linux-amd64
          - target: linux:arm64
            asset: linux-arm64
          - target: darwin:amd64
            asset: darwin-amd64
          - target: darwin:arm64
            asset: darwin-arm64
          - target: windows:amd64
            asset: windows-amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: src/agent/go.mod
          cache-dependency-path: src/agent/go.sum
      - name: Build Agent asset
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APT_MIRROR: ${{ vars.CI_UBUNTU_APT_MIRROR }}
        run: |
          ./release/ci/build-agent-asset.sh \
            "${{ matrix.target }}" \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.commit }}" \
            "_internal-agent-${{ matrix.asset }}.tar"
      - name: Upload Agent asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}" \
            "_internal-agent-${{ matrix.asset }}.tar" --clobber

  certify-source-host:
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    name: Certify · Agent · ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    needs: [prepare, build-agent]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux:amd64
            platform: linux
            arch: amd64
            asset: linux-amd64
            runner: ubuntu-24.04
          - target: linux:arm64
            platform: linux
            arch: arm64
            asset: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin:amd64
            platform: darwin
            arch: amd64
            asset: darwin-amd64
            runner: macos-15-intel
          - target: darwin:arm64
            platform: darwin
            arch: arm64
            asset: darwin-arm64
            runner: macos-15
          - target: windows:amd64
            platform: windows
            arch: amd64
            asset: windows-amd64
            runner: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download immutable Agent candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release download "${{ needs.prepare.outputs.tag }}"
          --pattern "_internal-agent-${{ matrix.asset }}.tar"
          --dir build/agent-candidate
      - name: Run native Source Host certification
        shell: bash
        run: >-
          python release/ci/certify-agent-candidate.py
          --internal-bundle "build/agent-candidate/_internal-agent-${{ matrix.asset }}.tar"
          --version "${{ needs.prepare.outputs.version }}"
          --commit "${{ needs.prepare.outputs.commit }}"
          --expected-platform "${{ matrix.platform }}"
          --expected-arch "${{ matrix.arch }}"
          --report "build/certification/_internal-agent-cert-${{ matrix.asset }}.json"
      - name: Verify Ubuntu Agent bundles offline
        if: ${{ matrix.target == 'linux:amd64' }}
        shell: bash
        run: |
          set -euo pipefail
          for ubuntu_release in 20.04 22.04 24.04; do
            ./release/ci/verify-ubuntu-agent-bundle.sh \
              "build/agent-candidate/_internal-agent-${{ matrix.asset }}.tar" \
              "${{ needs.prepare.outputs.version }}" \
              "$ubuntu_release"
          done
      - name: Upload certification evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          report="build/certification/_internal-agent-cert-${{ matrix.asset }}.json"
          if [[ -s "$report" ]]; then
            ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}" "$report" --clobber
          fi

  agent-release-gate:
    name: Gate · Agent release
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare, certify-source-host]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download Agent candidates and certification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p build/agent-candidates build/certification
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --pattern '_internal-agent-*.tar' \
            --dir build/agent-candidates
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --pattern '_internal-agent-cert-*.json' \
            --dir build/certification
      - name: Enforce Source Host release gate
        run: |
          python3 release/ci/verify-agent-certifications.py \
            --candidates-dir build/agent-candidates \
            --reports-dir build/certification \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --required-target linux:amd64 \
            --required-target linux:arm64 \
            --required-target darwin:amd64 \
            --required-target darwin:arm64 \
            --required-target windows:amd64 \
            --output build/certification/_internal-agent-certification-summary.json
      - name: Upload certification summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}"
          build/certification/_internal-agent-certification-summary.json --clobber

  build-host-debs:
    name: Package · Host dependencies · Ubuntu ${{ matrix.ubuntu_release }}
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [prepare, quality]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu_release: "20.04"
            asset: ubuntu2004
          - ubuntu_release: "22.04"
            asset: ubuntu2204
          - ubuntu_release: "24.04"
            asset: ubuntu2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Build host dependency asset
        env:
          APT_MIRROR: ${{ vars.CI_UBUNTU_APT_MIRROR }}
        run: >-
          ./release/ci/build-host-debs-asset.sh
          "${{ matrix.ubuntu_release }}"
          "_internal-host-debs-${{ matrix.asset }}.tar"
      - name: Verify host dependencies install offline
        run: >-
          ./release/ci/verify-host-debs-asset.sh
          "${{ matrix.ubuntu_release }}"
          "_internal-host-debs-${{ matrix.asset }}.tar"
      - name: Upload host dependency asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}"
          "_internal-host-debs-${{ matrix.asset }}.tar" --clobber

  export-hfl-images:
    name: Package · HFL images
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [prepare, build-hfl-images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Download image metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ci-metadata
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '_internal-hfl-*.json' --dir build/ci-metadata
          for file in build/ci-metadata/_internal-*.json; do mv "$file" "${file/_internal-/}"; done
      - name: Export offline HFL archive
        run: |
          ./release/ci/export-hfl-images.sh \
            build/ci-metadata \
            "${{ needs.prepare.outputs.image_version }}" \
            _internal-hfl-images.tar
      - name: Upload offline HFL archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}" _internal-hfl-images.tar --clobber

  export-sourcelens-bundle:
    name: Package · SourceLens
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [prepare, build-sourcelens-images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Download image metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ci-metadata
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '_internal-sourcelens-*.json' --dir build/ci-metadata
          for file in build/ci-metadata/_internal-*.json; do mv "$file" "${file/_internal-/}"; done
      - name: Export bundled SourceLens runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./release/ci/export-sourcelens-bundle.sh \
            build/ci-metadata \
            "${{ needs.prepare.outputs.version }}" \
            _internal-sourcelens-bundle.tar
      - name: Upload bundled SourceLens runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}" _internal-sourcelens-bundle.tar --clobber

  export-runtime-images:
    name: Package · Runtime images
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [prepare, quality]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - run: ./release/ci/export-runtime-images.sh _internal-runtime-images.tar
      - name: Upload runtime images
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}" _internal-runtime-images.tar --clobber

  assemble-release:
    name: Assemble · Release
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - prepare
      - build-agent
      - agent-release-gate
      - build-host-debs
      - export-hfl-images
      - export-sourcelens-bundle
      - export-runtime-images
    permissions:
      contents: write
    outputs:
      stored: ${{ steps.store-enterprise.outputs.stored }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Download matrix bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ci-input
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '_internal-*.tar' --dir build/ci-input
      - name: Assemble canonical offline release
        env:
          # Same sources as image bake so packaged .env.example matches image ENV.
          RELEASE_EDITION: ${{ needs.prepare.outputs.edition }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          HFL_EXTENSION_EXPECTED_COMMIT: ${{ needs.prepare.outputs.enterprise_commit }}
          ENTERPRISE_EXTENSION_REPOSITORY: ${{ vars.ENTERPRISE_EXTENSION_REPOSITORY }}
          HFL_EXTENSION_GIT_TOKEN: ${{ secrets.ENTERPRISE_EXTENSION_GIT_TOKEN }}
        run: |
          if [[ "$RELEASE_EDITION" == "enterprise" ]]; then
            export HFL_EXTENSION_SOURCES="${ENTERPRISE_EXTENSION_REPOSITORY}@${RELEASE_TAG}"
          else
            export HFL_EXTENSION_SOURCES=""
          fi
          ./release/ci/assemble-release.sh \
            --input-dir build/ci-input \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --edition "${{ needs.prepare.outputs.edition }}"
      - name: Upload Community assets to draft release
        if: ${{ needs.prepare.outputs.edition == 'community' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            gh release delete-asset "${{ needs.prepare.outputs.tag }}" "$asset" --yes
          done < <(gh release view "${{ needs.prepare.outputs.tag }}" --json assets \
            --jq '.assets[] | select(.name | startswith("_internal-") | not) | .name')
          while IFS= read -r asset; do
            ./release/ci/gh-release-upload.sh "${{ needs.prepare.outputs.tag }}" \
              "build/release/dist/${asset}" --clobber
          done < build/release/release-assets.txt
      - name: Stage Enterprise release on TEST host
        id: store-enterprise
        if: ${{ needs.prepare.outputs.edition == 'enterprise' }}
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TEST_SSH_HOST: ${{ vars.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ vars.TEST_SSH_USER }}
          TEST_SSH_KNOWN_HOSTS: ${{ vars.TEST_SSH_KNOWN_HOSTS }}
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEST_SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ && "$TEST_SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$TEST_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ -n "$TEST_SSH_KNOWN_HOSTS" && -n "$TEST_SSH_PRIVATE_KEY" ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$TEST_SSH_PRIVATE_KEY" > ~/.ssh/hyperfilelens_test
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/hyperfilelens_test
          incoming="/root/hfl-release/.incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/hyperfilelens_test -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$TEST_SSH_PORT" "$TEST_SSH_USER@$TEST_SSH_HOST" \
            "install -d -m 0700 '$incoming'"
          scp -i ~/.ssh/hyperfilelens_test -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -P "$TEST_SSH_PORT" build/release/dist/* \
            "$TEST_SSH_USER@$TEST_SSH_HOST:$incoming/"
          echo 'stored=true' >> "$GITHUB_OUTPUT"
      - name: Disk report
        if: always()
        run: df -h

  verify-release:
    name: Verify · Release
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [prepare, assemble-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Reclaim unused runner toolchains
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune -af || true
          df -h
      - name: Download Community release candidate from draft
        if: ${{ needs.prepare.outputs.edition == 'community' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release-candidate
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --pattern 'hyperfilelens-*.tar.gz*' \
            --pattern 'SHA256SUMS' \
            --pattern 'MANIFEST.json' \
            --pattern 'SBOM.spdx.json' \
            --pattern 'hyperfilelens-root-ca.crt' \
            --pattern 'assemble-release.*' \
            --dir build/release-candidate
      - name: Download Enterprise release candidate from TEST host
        if: ${{ needs.prepare.outputs.edition == 'enterprise' }}
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TEST_SSH_HOST: ${{ vars.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ vars.TEST_SSH_USER }}
          TEST_SSH_KNOWN_HOSTS: ${{ vars.TEST_SSH_KNOWN_HOSTS }}
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh build/release-candidate
          printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$TEST_SSH_PRIVATE_KEY" > ~/.ssh/hyperfilelens_test
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/hyperfilelens_test
          remote="/root/hfl-release/.incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp -r -i ~/.ssh/hyperfilelens_test \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -P "$TEST_SSH_PORT" \
            "$TEST_SSH_USER@$TEST_SSH_HOST:$remote/." \
            build/release-candidate/
      - name: Verify checksums and reconstruct package when split
        id: package
        working-directory: build/release-candidate
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          archive="$(awk '$2 ~ /^hyperfilelens-.*\.tar\.gz$/ { print $2; exit }' SHA256SUMS)"
          if [[ -z "$archive" ]]; then
            first="$(awk '$2 ~ /^hyperfilelens-.*\.tar\.gz\.part-000$/ { print $2; exit }' SHA256SUMS)"
            [[ -n "$first" ]]
            archive="${first%.part-000}"
            cat "${archive}.part-"* > "$archive"
          else
            [[ -f "$archive" ]]
          fi
          echo "archive=$(realpath "$archive")" >> "$GITHUB_OUTPUT"
      - name: Full offline install and browser login smoke
        run: ./release/ci/verify-release.sh --archive "${{ steps.package.outputs.archive }}" --install
      - name: Capture failed install diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -f /opt/hyperfilelens/docker-compose.yml ]]; then
            sudo docker compose -f /opt/hyperfilelens/docker-compose.yml \
              --env-file /opt/hyperfilelens/.env ps -a
            sudo docker compose -f /opt/hyperfilelens/docker-compose.yml \
              --env-file /opt/hyperfilelens/.env logs --no-color --tail 200
          fi
          if [[ -f /opt/hyperfilelens/sourcelens/docker-compose.yml ]]; then
            sudo docker compose -f /opt/hyperfilelens/sourcelens/docker-compose.yml \
              --env-file /opt/hyperfilelens/data/sourcelens/config/.env ps -a
            sudo docker compose -f /opt/hyperfilelens/sourcelens/docker-compose.yml \
              --env-file /opt/hyperfilelens/data/sourcelens/config/.env logs --no-color --tail 200
          fi
          sudo docker system df
          df -h

  publish-release:
    name: Publish · Release
    if: ${{ needs.prepare.outputs.build_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [prepare, verify-release]
    permissions:
      contents: write
    outputs:
      deployable: ${{ steps.publish.outputs.deployable }}
      disposition: ${{ steps.publish.outputs.disposition }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Remove internal assets and publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_CHANNEL: ${{ needs.prepare.outputs.channel }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.tag }}
          RELEASE_EDITION: ${{ needs.prepare.outputs.edition }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TEST_SSH_HOST: ${{ vars.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ vars.TEST_SSH_USER }}
          TEST_SSH_KNOWN_HOSTS: ${{ vars.TEST_SSH_KNOWN_HOSTS }}
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EDITION" == "enterprise" ]]; then
            install -d -m 0700 ~/.ssh
            printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            printf '%s\n' "$TEST_SSH_PRIVATE_KEY" > ~/.ssh/hyperfilelens_test
            chmod 0600 ~/.ssh/known_hosts ~/.ssh/hyperfilelens_test
            incoming="/root/hfl-release/.incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            ssh -i ~/.ssh/hyperfilelens_test -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -p "$TEST_SSH_PORT" "$TEST_SSH_USER@$TEST_SSH_HOST" \
              "bash -s -- '$RELEASE_TAG' '$incoming' /root/hfl-release 10" \
              < .github/scripts/store-enterprise-release.sh
            gh release delete "$ARTIFACT_ID" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            {
              echo 'deployable=true'
              echo 'disposition=stored-on-test-host'
            } >> "$GITHUB_OUTPUT"
            printf '### Enterprise release\n\nVerified and stored on the TEST host; the temporary GitHub build candidate was deleted.\n' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            gh release delete-asset "${{ needs.prepare.outputs.tag }}" "$asset" \
              --repo "${GITHUB_REPOSITORY}" --yes
          done < <(gh release view "${{ needs.prepare.outputs.tag }}" \
            --repo "${GITHUB_REPOSITORY}" --json assets \
            --jq '.assets[] | select(.name | startswith("_internal-")) | .name')
          release_api_url="$(gh release view "$ARTIFACT_ID" \
            --repo "$GITHUB_REPOSITORY" --json apiUrl --jq '.apiUrl')"
          release_api_prefix="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/"
          [[ "$release_api_url" == "$release_api_prefix"* ]]
          release_id="${release_api_url#"$release_api_prefix"}"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api --method PATCH \
            "$release_api_url" \
            -F draft=false -F prerelease=false -f make_latest=legacy --silent
          deployable=true
          disposition=published
          {
            echo "deployable=$deployable"
            echo "disposition=$disposition"
          } >> "$GITHUB_OUTPUT"

  deploy-test:
    name: Deploy · TEST
    needs: [prepare, publish-release]
    if: >-
      ${{
        always() &&
        needs.prepare.outputs.edition == 'enterprise' &&
        vars.TEST_AUTO_DEPLOY != 'false' &&
        needs.prepare.result == 'success' &&
        (
          (
            needs.publish-release.result == 'success' &&
            needs.publish-release.outputs.deployable == 'true'
          ) ||
          (
            needs.prepare.outputs.build_required == 'false' &&
            needs.publish-release.result == 'skipped'
          )
        )
      }}
    uses: ./.github/workflows/deploy_target.yml
    with:
      target: test
      channel: release
      package_source: host-store
      tag: ${{ needs.prepare.outputs.release_tag }}
      public_url: ${{ vars.TEST_PUBLIC_URL }}
      admin_public_url: ${{ vars.TEST_ADMIN_PUBLIC_URL }}
      ssh_host: ${{ vars.TEST_SSH_HOST }}
      ssh_port: ${{ vars.TEST_SSH_PORT }}
      ssh_user: ${{ vars.TEST_SSH_USER }}
      ssh_known_hosts: ${{ vars.TEST_SSH_KNOWN_HOSTS }}
      turnstile_site_key: ${{ vars.TEST_TURNSTILE_SITE_KEY }}
      turnstile_enabled: ${{ vars.TEST_TURNSTILE_ENABLED == 'true' }}
      email_signup_enabled: ${{ vars.TEST_EMAIL_SIGNUP_ENABLED == 'true' }}
      email_code_login_enabled: ${{ vars.TEST_EMAIL_CODE_LOGIN_ENABLED != 'false' }}
      google_oauth_enabled: ${{ vars.TEST_GOOGLE_OAUTH_ENABLED == 'true' }}
      google_client_id: ${{ vars.TEST_GOOGLE_CLIENT_ID }}
      sentry_enabled: ${{ vars.TEST_SENTRY_ENABLED == 'true' }}
      platform_gateway_auto_deploy: ${{ vars.TEST_PLATFORM_GATEWAY_AUTO_DEPLOY == 'true' }}
      hfl_insecure_tls: ${{ vars.TEST_HFL_INSECURE_TLS }}
      smtp_host: ${{ vars.TEST_SMTP_HOST }}
      smtp_port: ${{ vars.TEST_SMTP_PORT }}
      smtp_username: ${{ vars.TEST_SMTP_USERNAME }}
      smtp_security: ${{ vars.TEST_SMTP_SECURITY }}
      email_from: ${{ vars.TEST_EMAIL_FROM }}
      ai_model_provider: ${{ vars.TEST_AI_MODEL_PROVIDER }}
      ai_model_id: ${{ vars.TEST_AI_MODEL_ID }}
      ai_model_display_name: ${{ vars.TEST_AI_MODEL_DISPLAY_NAME }}
      ai_multimodal_model_provider: ${{ vars.TEST_AI_MULTIMODAL_MODEL_PROVIDER }}
      ai_multimodal_model_id: ${{ vars.TEST_AI_MULTIMODAL_MODEL_ID }}
      ai_multimodal_model_display_name: ${{ vars.TEST_AI_MULTIMODAL_MODEL_DISPLAY_NAME }}
    secrets:
      ssh_private_key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
      turnstile_secret_key: ${{ secrets.TEST_TURNSTILE_SECRET_KEY }}
      smtp_password: ${{ secrets.TEST_SMTP_PASSWORD }}
      google_client_secret: ${{ secrets.TEST_GOOGLE_CLIENT_SECRET }}
      ai_model_api_base: ${{ secrets.TEST_AI_MODEL_API_BASE }}
      ai_model_api_key: ${{ secrets.TEST_AI_MODEL_API_KEY }}
      sentry_backend_dsn: ${{ secrets.SENTRY_BACKEND_DSN }}
      sentry_frontend_dsn: ${{ secrets.SENTRY_FRONTEND_DSN }}
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  promote-production:
    name: Promote · PROD
    needs: [prepare, deploy-test]
    if: >-
      ${{
        always() &&
        needs.prepare.outputs.edition == 'enterprise' &&
        vars.TEST_AUTO_DEPLOY != 'false' &&
        vars.PROD_AUTO_DEPLOY != 'false' &&
        needs.deploy-test.result == 'success'
      }}
    uses: ./.github/workflows/enterprise_promotion.yml
    with:
      tag: ${{ needs.prepare.outputs.release_tag }}
      automatic: true
    secrets: inherit

  deploy-community:
    name: Deploy · Community
    needs: [prepare, publish-release]
    if: >-
      ${{
        always() &&
        needs.prepare.outputs.edition == 'community' &&
        vars.COMMUNITY_AUTO_DEPLOY != 'false' &&
        needs.prepare.result == 'success' &&
        (
          (
            needs.publish-release.result == 'success' &&
            needs.publish-release.outputs.deployable == 'true'
          ) ||
          (
            needs.prepare.outputs.build_required == 'false' &&
            needs.publish-release.result == 'skipped'
          )
        )
      }}
    uses: ./.github/workflows/deploy_target.yml
    with:
      target: community
      channel: release
      tag: ${{ needs.prepare.outputs.release_tag }}
      public_url: ${{ vars.COMMUNITY_PUBLIC_URL }}
      admin_public_url: ${{ vars.COMMUNITY_ADMIN_PUBLIC_URL }}
      release_download_proxy_url: ${{ vars.COMMUNITY_RELEASE_DOWNLOAD_PROXY_URL }}
      ssh_host: ${{ vars.COMMUNITY_SSH_HOST }}
      ssh_port: ${{ vars.COMMUNITY_SSH_PORT }}
      ssh_user: ${{ vars.COMMUNITY_SSH_USER }}
      ssh_known_hosts: ${{ vars.COMMUNITY_SSH_KNOWN_HOSTS }}
      turnstile_site_key: ${{ vars.COMMUNITY_TURNSTILE_SITE_KEY }}
      turnstile_enabled: ${{ vars.COMMUNITY_TURNSTILE_ENABLED == 'true' }}
      email_signup_enabled: ${{ vars.COMMUNITY_EMAIL_SIGNUP_ENABLED == 'true' }}
      email_code_login_enabled: ${{ vars.COMMUNITY_EMAIL_CODE_LOGIN_ENABLED != 'false' }}
      google_oauth_enabled: ${{ vars.COMMUNITY_GOOGLE_OAUTH_ENABLED == 'true' }}
      google_client_id: ${{ vars.COMMUNITY_GOOGLE_CLIENT_ID }}
      sentry_enabled: ${{ vars.COMMUNITY_SENTRY_ENABLED == 'true' }}
      platform_gateway_auto_deploy: ${{ vars.COMMUNITY_PLATFORM_GATEWAY_AUTO_DEPLOY == 'true' }}
      hfl_insecure_tls: ${{ vars.COMMUNITY_HFL_INSECURE_TLS }}
      smtp_host: ${{ vars.COMMUNITY_SMTP_HOST }}
      smtp_port: ${{ vars.COMMUNITY_SMTP_PORT }}
      smtp_username: ${{ vars.COMMUNITY_SMTP_USERNAME }}
      smtp_security: ${{ vars.COMMUNITY_SMTP_SECURITY }}
      email_from: ${{ vars.COMMUNITY_EMAIL_FROM }}
      ai_model_provider: ${{ vars.COMMUNITY_AI_MODEL_PROVIDER }}
      ai_model_id: ${{ vars.COMMUNITY_AI_MODEL_ID }}
      ai_model_display_name: ${{ vars.COMMUNITY_AI_MODEL_DISPLAY_NAME }}
      ai_multimodal_model_provider: ${{ vars.COMMUNITY_AI_MULTIMODAL_MODEL_PROVIDER }}
      ai_multimodal_model_id: ${{ vars.COMMUNITY_AI_MULTIMODAL_MODEL_ID }}
      ai_multimodal_model_display_name: ${{ vars.COMMUNITY_AI_MULTIMODAL_MODEL_DISPLAY_NAME }}
    secrets:
      ssh_private_key: ${{ secrets.COMMUNITY_SSH_PRIVATE_KEY }}
      turnstile_secret_key: ${{ secrets.COMMUNITY_TURNSTILE_SECRET_KEY }}
      smtp_password: ${{ secrets.COMMUNITY_SMTP_PASSWORD }}
      google_client_secret: ${{ secrets.COMMUNITY_GOOGLE_CLIENT_SECRET }}
      ai_model_api_base: ${{ secrets.COMMUNITY_AI_MODEL_API_BASE }}
      ai_model_api_key: ${{ secrets.COMMUNITY_AI_MODEL_API_KEY }}
      sentry_backend_dsn: ${{ secrets.SENTRY_BACKEND_DSN }}
      sentry_frontend_dsn: ${{ secrets.SENTRY_FRONTEND_DSN }}
      sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  cleanup-enterprise-candidate:
    name: Cleanup · Enterprise candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [prepare, publish-release]
    if: >-
      ${{
        always() &&
        needs.prepare.outputs.edition == 'enterprise' &&
        needs.prepare.outputs.build_required == 'true' &&
        needs.prepare.result == 'success' &&
        needs.publish-release.result != 'success'
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Delete temporary Enterprise candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.tag }}
          TEST_SSH_HOST: ${{ vars.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ vars.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ vars.TEST_SSH_USER }}
          TEST_SSH_KNOWN_HOSTS: ${{ vars.TEST_SSH_KNOWN_HOSTS }}
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$TEST_SSH_PRIVATE_KEY" > ~/.ssh/hyperfilelens_test
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/hyperfilelens_test
          ssh -i ~/.ssh/hyperfilelens_test -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$TEST_SSH_PORT" "$TEST_SSH_USER@$TEST_SSH_HOST" \
            "rm -rf -- '/root/hfl-release/.incoming/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" \
            || true
          gh release delete "$ARTIFACT_ID" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes \
            || true
